/* Raio-X completo de Ronilson Oliveira, prefeito de Croatá: eleições 2016–2024 seção a seção, ranking no Ceará e na Ibiapaba, Câmara, vereadores, eleição de 2026 e orçamento. Fontes: TSE e Tesouro Nacional. */
