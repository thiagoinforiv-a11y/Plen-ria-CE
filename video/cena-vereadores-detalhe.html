<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Vereadores um por um</title>
<style>
  html, body { margin: 0; background: #070707; }
  canvas { display: block; width: 540px; height: 960px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="efeitos.js"></script>
<script>
/* Vídeo "Os 11 vereadores, um por um" — render(t) desenha o instante t (segundos de cena).
 * Números de dados-vereadores-detalhe.json (TSE 2020 e 2024, votação por local), gerado por video/dados-vereadores-detalhe.mjs. */
(async () => {
  const W = 1080, H = 1920, cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const D = await (await fetch("dados-vereadores-detalhe.json")).json(), G = await (await fetch("geo-ce.json")).json();
  const AC = "#d4ff3a", FONT = "Inter, 'Inter Display', sans-serif";
  const fmt = (n) => Math.round(n).toLocaleString("pt-BR");
  const pc = (x, d = 1) => (x * 100).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%";
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, k) => a + (b - a) * k;
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const eout = (x) => 1 - Math.pow(1 - x, 3);
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const vis = (t, a, b, f = 0.45) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
  let seed = 11; const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const CORP = { MDB: "#ff7a45", PSB: AC, PT: "#ff4d6d" }, corP = (p) => CORP[p] || "#a8a59c";
  const E = D.eleitos, NE = E.length, LOC = Object.fromEntries(D.locais.map((l) => [l.id, l]));
  const nomeC = (n) => { const f = n.split(" ")[0]; return n.length > 13 && E.filter((x) => x.urna.split(" ")[0] === f).length === 1 ? f : n; };
  const curtoLocal = (n) => n.split("-")[0].replace(/^E\.?\s?e\.?\s?[a-z]*\.?\s*/i, "").replace(/^E\.e\.[a-z]+\.\s*/i, "").trim();

  // ---------------- tempos (cena): abertura, visão geral, 1 bloco por vereador, quociente, final
  const TV = (k) => 15 + k * 10, TQ = TV(NE), TF = TQ + 10, FIM = TF + 6;
  window.DURACAO = FIM;

  // ---------------- mapa de Varjota (polígono IBGE + locais de votação)
  const poly = G.poly["2313955"], lons = poly.map((p) => p[0]), lats = poly.map((p) => p[1]);
  const kx = Math.cos((4.17 * Math.PI) / 180), B = [Math.min(...lons), Math.max(...lons), Math.min(...lats), Math.max(...lats)];
  const vista = (cx, cy, w, h) => { const s = Math.min(w / ((B[1] - B[0]) * kx), h / (B[3] - B[2])); return { cx, cy, s, lon: (B[0] + B[1]) / 2, lat: (B[2] + B[3]) / 2 }; };
  const proj = (lon, lat, v) => [v.cx + (lon - v.lon) * v.s * kx, v.cy - (lat - v.lat) * v.s];
  const V0 = vista(W / 2, 1010, 900, 760), VV = vista(W / 2, 1330, 760, 330);
  const desenhaMapa = (v, a) => { if (a <= 0.01) return; ctx.save(); ctx.globalAlpha = a; ctx.beginPath(); poly.forEach(([lon, lat], i) => { const [x, y] = proj(lon, lat, v); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath();
    ctx.fillStyle = "rgba(255,255,255,.025)"; ctx.fill(); ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.lineWidth = 1.6; ctx.stroke(); ctx.restore(); };

  // ---------------- imagens
  const img = {};
  const carregar = (k, src) => new Promise((ok) => { if (!src) return ok(); const i = new Image(); i.onload = () => { img[k] = i; ok(); }; i.onerror = () => ok(); i.src = "../" + src; });
  await Promise.all(E.map((e) => carregar(e.urna, e.foto)));
  await document.fonts.load("900 60px Inter"); await document.fonts.load("500 30px Inter");

  // ---------------- formas de partículas
  const N = 2400;
  const P = Array.from({ length: N }, () => ({ s: 0.8 + rnd() * 2.2, ph: rnd() * 6.283, d: rnd() * 0.35, a: 0.35 + rnd() * 0.65 }));
  const forma = {}, poeira = () => [rnd() * W, rnd() * H, "dust"];
  const completa = (out) => { while (out.length < N) out.push(poeira()); return out.slice(0, N); };
  const anel = (cx, cy, r, n, cor, esp = 22) => Array.from({ length: n }, () => { const a = rnd() * 6.283, rr = r + Math.abs(gauss()) * esp; return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, cor]; });
  // nuvens nos locais de votação, proporcionais aos votos
  const nuvens = (pares, v, n, cor, destaque) => { const tot = pares.reduce((t, [, x]) => t + x, 0), out = [];
    pares.forEach(([l, x], i) => { const k = Math.round((n * x) / tot), [px, py] = proj(LOC[l].lon, LOC[l].lat, v), r = 6 + Math.sqrt(x) * 1.6;
      for (let j = 0; j < k; j++) { const a = rnd() * 6.283, rr = Math.sqrt(rnd()) * r; out.push([px + Math.cos(a) * rr, py + Math.sin(a) * rr, destaque && i === 0 ? "#ffffff" : cor]); } });
    return out; };
  forma.poeira = Array.from({ length: N }, () => [rnd() * W, rnd() * H]);
  // abertura: votos de todos os vereadores eleitos, por local
  const totLoc = {}; E.forEach((e) => e.locais.forEach(([l, x]) => (totLoc[l] = (totLoc[l] || 0) + x)));
  forma.mapa = completa(nuvens(Object.entries(totLoc).sort((a, b) => b[1] - a[1]), V0, N * 0.9, AC, false));
  // visão geral: 11 anéis (4-4-3)
  const GRADE = E.map((e, i) => { const row = i < 4 ? 0 : i < 8 ? 1 : 2, col = row < 2 ? i % 4 : i - 8, nrow = row < 2 ? 4 : 3; return [W / 2 + (col - (nrow - 1) / 2) * 230, 640 + row * 300]; });
  forma.grade = completa(E.flatMap((e, i) => anel(GRADE[i][0], GRADE[i][1], 88, Math.floor((N * 0.9) / NE), corP(e.partido), 14)));
  // um por vereador: anel na foto + nuvens no mapa
  const FY = 520;
  E.forEach((e, k) => { forma["v" + k] = completa([...anel(W / 2, FY, 160, Math.floor(N * 0.42), corP(e.partido), 26), ...nuvens(e.locais, VV, N * 0.5, corP(e.partido), true)]); });
  // quociente: barras horizontais
  const QB0 = 360, QBW = 600, QY0 = 470, QDY = 96, vmax = E[0].votos, QEX = QB0 + (QBW * D.qe) / vmax;
  forma.quociente = completa(E.flatMap((e, i) => { const w = (QBW * e.votos) / vmax, n = Math.floor((N * 0.92 * e.votos) / E.reduce((t, x) => t + x.votos, 0)); return Array.from({ length: n }, () => [QB0 + rnd() * w, QY0 + i * QDY + gauss() * 9, corP(e.partido)]); }));
  forma.fim = Array.from({ length: N }, () => { const a = rnd() * 6.283, r = 300 + gauss() * 18; return [W / 2 + Math.cos(a) * r, 900 + Math.sin(a) * r * 0.32, rnd() < 0.3 ? AC : "#fff"]; });

  const KF = [[0, "poeira", 0], [0.8, "mapa", 2.2], [7.2, "grade", 2.0], ...E.map((e, k) => [TV(k) + 0.1, "v" + k, 1.8]), [TQ + 0.1, "quociente", 2.0], [TF + 0.1, "fim", 2.0]];
  const posicao = (t) => { let k = 0; while (k + 1 < KF.length && t >= KF[k + 1][0]) k++; const [t0, nome, dur] = KF[k]; return { ant: k ? forma[KF[k - 1][1]] : forma[nome], cur: forma[nome], t0, dur }; };

  // ---------------- desenho
  const fundo = (t) => {
    const g = ctx.createRadialGradient(W / 2, H * 0.42, 50, W / 2, H * 0.5, H * 0.8); g.addColorStop(0, "#1b1c1a"); g.addColorStop(1, "#060606"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 9; i++) { const x = (i * 263 + t * 9 * (i % 3 + 1)) % (W + 200) - 100, y = (i * 517) % H + Math.sin(t * 0.3 + i) * 30, r = 50 + (i % 4) * 30;
      const b = ctx.createRadialGradient(x, y, 0, x, y, r); b.addColorStop(0, "rgba(255,255,255,.035)"); b.addColorStop(1, "rgba(255,255,255,0)"); ctx.fillStyle = b; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
  };
  const texto = (s, x, y, o = {}) => {
    const a = o.a == null ? 1 : o.a; if (a <= 0.01) return;
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = o.cor || "#f3f1ea"; ctx.textAlign = o.al || "center"; ctx.textBaseline = "alphabetic";
    ctx.font = `${o.w || 700} ${o.tam || 56}px ${FONT}`; ctx.letterSpacing = (o.ls || 0) + "px";
    if (o.brilho) { ctx.shadowColor = o.cor || "rgba(255,255,255,.6)"; ctx.shadowBlur = o.brilho; }
    const dy = o.sobe ? (1 - a) * 24 : 0;
    String(s).split("\n").forEach((l, i) => ctx.fillText(l, x, y + dy + i * (o.lh || (o.tam || 56) * 1.18)));
    ctx.restore();
  };
  const iniciais = (n) => n.split(" ").filter((w) => w.length > 2).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || n.slice(0, 2).toUpperCase();
  const foto = (k, x, y, r, a, cor) => {
    if (a <= 0.01) return; const s = 0.85 + 0.15 * eout(a);
    ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s, s);
    ctx.shadowColor = cor; ctx.shadowBlur = 40; ctx.beginPath(); ctx.arc(0, 0, r + 6, 0, 6.283); ctx.fillStyle = "#111"; ctx.fill(); ctx.shadowBlur = 0;
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.clip();
    if (img[k]) { const i = img[k], sc = Math.max((2 * r) / i.width, (2 * r) / i.height); ctx.drawImage(i, -i.width * sc / 2, -i.height * sc * 0.42, i.width * sc, i.height * sc); }
    else { ctx.fillStyle = "#1a1a18"; ctx.fillRect(-r, -r, 2 * r, 2 * r); ctx.fillStyle = "#f3f1ea"; ctx.font = `900 ${Math.round(r * 0.7)}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(iniciais(k), 0, 2); }
    ctx.restore(); ctx.lineWidth = Math.max(3, r / 30); ctx.strokeStyle = cor; ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, 6.283); ctx.stroke(); ctx.restore();
  };
  const caixa = (x, y, w, h, a, cor = "rgba(212,255,58,.35)") => { if (a <= 0.01) return; ctx.save(); ctx.globalAlpha = a * 0.9; ctx.fillStyle = "rgba(255,255,255,.045)"; ctx.strokeStyle = cor; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x, y, w, h, 24); ctx.fill(); ctx.stroke(); ctx.restore(); };
  const marca = () => { ctx.save(); ctx.font = `700 19px ${FONT}`; ctx.letterSpacing = "4px"; const s = "PLENÁRIA CE", w = ctx.measureText(s).width + 36; const x = W - w - 60, y = H - 120;
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(x, y, w, 40, 20); ctx.stroke(); ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.textAlign = "left"; ctx.fillText(s, x + 18, y + 27); ctx.restore(); };
  const particulas = (t) => {
    const { ant, cur, t0, dur } = posicao(t);
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < N; i++) {
      const p = P[i], k = dur ? ease(clamp(((t - t0) / dur - p.d) / (1 - 0.35))) : 1, a0 = ant[i], a1 = cur[i];
      let x = lerp(a0[0], a1[0], k) + Math.sin(t * 0.9 + p.ph) * 1.6, y = lerp(a0[1], a1[1], k) + Math.cos(t * 0.8 + p.ph) * 1.6;
      const curva = Math.sin(k * Math.PI) * 60 * (p.d - 0.17); x += curva; y -= curva * 0.6;
      const c = (k > 0.5 ? a1[2] : a0[2]) || "#fff";
      let al = p.a * (0.55 + 0.45 * Math.sin(t * 2 + p.ph * 3) ** 2); if (c === "dust") al *= 0.14;
      ctx.globalAlpha = clamp(al); ctx.fillStyle = c === "dust" ? "#fff" : c; ctx.beginPath(); ctx.arc(x, y, p.s, 0, 6.283); ctx.fill();
      if (dur && k > 0 && k < 1) { const k2 = ease(clamp(((t - 0.06 - t0) / dur - p.d) / (1 - 0.35))), xb = lerp(a0[0], a1[0], k2), yb = lerp(a0[1], a1[1], k2);
        if (Math.hypot(x - xb, y - yb) > 3) { ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = p.s * 0.9; ctx.globalAlpha = clamp(al * 0.3); ctx.beginPath(); ctx.moveTo(xb, yb); ctx.lineTo(x, y); ctx.stroke(); } }
    }
    ctx.restore();
  };
  const hist = (e) => e.eleito20 ? [`2020: ${fmt(e.v20)}  →  2024: ${fmt(e.votos)}`, `${e.votos >= e.v20 ? "+" : "−"}${fmt(Math.abs(e.votos - e.v20))} votos · mais um mandato`, e.votos >= e.v20 ? AC : "#ff4d6d"]
    : e.v20 ? [`2020: ${fmt(e.v20)} (sem vaga)  →  2024: ${fmt(e.votos)}`, "chegou à Câmara", AC] : ["Não disputou a Câmara em 2020", "primeira vaga", AC];

  window.render = (t) => {
    ctx.clearRect(0, 0, W, H); fundo(t);
    desenhaMapa(V0, vis(t, 0.6, 7.3));
    E.forEach((e, k) => desenhaMapa(VV, vis(t, TV(k) + 0.6, TV(k + 1) + 0.2)));
    // quociente: linha
    if (t > TQ && t < TF) { const a = vis(t, TQ + 1.2, TF); ctx.save(); ctx.globalAlpha = a; ctx.setLineDash([10, 8]); ctx.strokeStyle = "#f3f1ea"; ctx.lineWidth = 2.5; const y1 = QY0 - 60, y2 = QY0 + (NE - 1) * QDY + 40; ctx.beginPath(); ctx.moveTo(QEX, y1); ctx.lineTo(QEX, lerp(y1, y2, eout(prog(t, TQ + 1.2, TQ + 2.4)))); ctx.stroke(); ctx.restore(); }
    particulas(t);

    // 1 · abertura
    texto("OS 11 VEREADORES", W / 2, 290, { tam: 92, w: 900, ls: 4, a: vis(t, 0.5, 7.1), brilho: 30, sobe: 1 });
    texto("VARJOTA · ELEITOS EM 2024 · UM POR UM", W / 2, 360, { tam: 30, w: 700, ls: 4, a: vis(t, 1.1, 7.1), cor: AC });
    texto("cada ponto = votos dos eleitos, por local de votação", W / 2, 1520, { tam: 28, w: 500, a: vis(t, 2.4, 7.1), cor: "#8d8b82" });
    // 2 · visão geral
    texto("CÂMARA DE VARJOTA", W / 2, 280, { tam: 40, w: 800, ls: 8, a: vis(t, 7.4, 15.1), cor: "#bdbab0" });
    texto("2025–2028", W / 2, 360, { tam: 60, w: 900, a: vis(t, 7.6, 15.1), cor: AC, brilho: 18 });
    E.forEach((e, i) => { const a = vis(t, 8 + i * 0.12, 15.1), [x, y] = GRADE[i];
      foto(e.urna, x, y, 72, a, corP(e.partido)); texto(nomeC(e.urna), x, y + 128, { tam: 24, w: 800, a }); texto(fmt(e.votos), x, y + 160, { tam: 24, w: 700, a, cor: corP(e.partido) }); });
    { const a = vis(t, 10.5, 15.1); const ps = {}; E.forEach((e) => (ps[e.partido] = (ps[e.partido] || 0) + 1));
      texto(`${D.candidatos} candidatos · ${D.cadeiras} cadeiras · ${E.filter((e) => !e.eleito20).length} caras novas`, W / 2, 1600, { tam: 36, w: 700, a, sobe: 1 });
      const lst = Object.entries(ps).sort((a, b) => b[1] - a[1]); lst.forEach(([p, n], i) => texto(`${p} ${n}`, W / 2 + (i - (lst.length - 1) / 2) * 220, 1690, { tam: 44, w: 900, a, cor: corP(p) }));
      texto(`quociente: ${fmt(D.qe)} votos`, W / 2, 1770, { tam: 30, w: 600, a, cor: "#bdbab0" }); }
    // 3 · um por um
    E.forEach((e, k) => { const t0 = TV(k), t1 = TV(k + 1) + 0.1, cor = corP(e.partido);
      if (t < t0 - 0.5 || t > t1 + 0.5) return;
      texto(`${k + 1} DE ${NE}`, 110, 200, { tam: 26, w: 800, ls: 6, al: "left", a: vis(t, t0 + 0.2, t1), cor: "#8d8b82" });
      texto(e.pos <= D.cadeiras ? `${e.pos}º LUGAR` : `${e.pos}º LUGAR · VAGA DO PARTIDO`, W - 110, 200, { tam: 26, w: 800, ls: 4, al: "right", a: vis(t, t0 + 0.3, t1), cor });
      foto(e.urna, W / 2, FY, 150, vis(t, t0 + 0.7, t1), cor);
      texto(e.urna, W / 2, 790, { tam: e.urna.length > 16 ? 60 : 72, w: 900, a: vis(t, t0 + 1.0, t1), sobe: 1 });
      texto(e.partido, W / 2, 845, { tam: 34, w: 800, ls: 6, a: vis(t, t0 + 1.1, t1), cor });
      texto(fmt(e.votos * eout(prog(t, t0 + 1.2, t0 + 2.8))), W / 2 - 20, 970, { tam: 110, w: 900, al: "right", a: vis(t, t0 + 1.2, t1), cor, brilho: 20 });
      texto("votos", W / 2, 945, { tam: 34, w: 700, al: "left", a: vis(t, t0 + 1.3, t1) }); texto(`${pc(e.pct)} dos válidos`, W / 2, 985, { tam: 26, w: 500, al: "left", a: vis(t, t0 + 1.3, t1), cor: "#bdbab0" });
      const [h1, h2, hc] = hist(e); texto(h1, W / 2, 1060, { tam: 32, w: 700, a: vis(t, t0 + 2.2, t1) }); texto(h2, W / 2, 1102, { tam: 26, w: 700, a: vis(t, t0 + 2.3, t1), cor: hc });
      // reduto no mapa
      const top = e.locais[0], [rx, ry] = proj(LOC[top[0]].lon, LOC[top[0]].lat, VV), ar = vis(t, t0 + 3.2, t1);
      if (ar > 0.01) { ctx.save(); ctx.globalAlpha = ar; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; const lx = rx < W / 2 ? 150 : W - 150; ctx.beginPath(); ctx.arc(rx, ry, 18 + 4 * Math.sin(t * 4), 0, 6.283); ctx.stroke(); ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(lx, 1180); ctx.stroke(); ctx.restore();
        texto(`maior reduto: ${fmt(top[1])}`, rx < W / 2 ? 110 : W - 110, 1168, { tam: 26, w: 800, al: rx < W / 2 ? "left" : "right", a: ar }); }
      // três números
      const tiles = [[`${e.venceu} de ${D.nlocais}`, "locais onde\nliderou a votação"], [pc(e.conc, 0), `dos votos vieram de\n${curtoLocal(e.top[0].nome)}`], [pc(e.top3, 0), "dos votos nos\n3 maiores locais"]];
      tiles.forEach(([v, d], i) => { const a = vis(t, t0 + 4 + i * 0.35, t1), x = 110 + i * 293; caixa(x, 1560, 273, 220, a, cor + "66");
        texto(v, x + 136, 1650, { tam: 52, w: 900, a, cor: i === 0 ? cor : "#f3f1ea" }); texto(d, x + 136, 1700, { tam: 21, w: 600, a, cor: "#bdbab0", lh: 26 }); });
      if (!e.qp) texto("entrou pela média (sobras)", W / 2, 1530, { tam: 26, w: 700, a: vis(t, t0 + 5, t1), cor: "#bdbab0" });
    });
    // 4 · quociente
    texto("QUEM PASSOU DO QUOCIENTE", W / 2, 280, { tam: 40, w: 900, ls: 4, a: vis(t, TQ + 0.4, TF), cor: "#bdbab0" });
    texto("sozinho, com os próprios votos", W / 2, 335, { tam: 28, w: 500, a: vis(t, TQ + 0.6, TF), cor: "#8d8b82" });
    E.forEach((e, i) => { const a = vis(t, TQ + 0.8 + i * 0.08, TF), y = QY0 + i * QDY; foto(e.urna, 130, y, 32, a, corP(e.partido));
      texto(nomeC(e.urna), 180, y + 9, { tam: 26, w: 800, al: "left", a }); texto(fmt(e.votos), QB0 + (QBW * e.votos) / vmax + 14, y + 9, { tam: 24, w: 800, al: "left", a, cor: e.votos >= D.qe ? AC : "#bdbab0" }); });
    texto(`quociente ${fmt(D.qe)}`, QEX, QY0 - 75, { tam: 26, w: 800, a: vis(t, TQ + 1.4, TF) });
    { const so = E.filter((e) => e.votos >= D.qe); texto(`Só ${so.length === 1 ? so[0].urna : so.length + " eleitos"} passou sozinha.\nOs outros ${NE - so.length} dependeram do partido.`.replace("passou sozinha", so.length === 1 ? "passou sozinha" : "passaram sozinhos"), W / 2, 1620, { tam: 42, w: 800, a: vis(t, TQ + 3, TF), sobe: 1 }); }
    // 5 · final
    texto("2028", W / 2, 920, { tam: 150, w: 900, a: vis(t, TF + 0.3, FIM, 0.6), cor: AC, brilho: 30, sobe: 1 });
