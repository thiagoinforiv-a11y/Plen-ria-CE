<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Os números da Câmara</title>
<style>
  html, body { margin: 0; background: #070707; }
  canvas { display: block; width: 540px; height: 960px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Série curta, Parte 1 — "Os números da Câmara" (30–45 s). Cena desenhada quadro a quadro: render(t).
 * Dados: curta-<cidade>.json (gerado de dados oficiais do TSE por video/curta.mjs). Tom neutro: sem partidos e sem grupos. */
(async () => {
  const W = 1080, H = 1920, cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const D = await (await fetch(new URLSearchParams(location.search).get("d") || "curta-varjota.json")).json(), G = await (await fetch("geo-ce.json")).json();
  const AC = "#d4ff3a", FONT = "Inter, 'Inter Display', sans-serif", CINZA = "#bdbab0";
  const fmt = (n) => Math.round(n).toLocaleString("pt-BR");
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, k) => a + (b - a) * k;
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const eout = (x) => 1 - Math.pow(1 - x, 3);
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const vis = (t, a, b, f = 0.4) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
  let seed = 11; const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const n = D.cadeiras, E = D.eleitos;
  // tempos das cenas (a narração estica cada uma; ver trilha-curta1-<cidade>.json)
  const S = [0, 5, 11, 18, 25, 33, 39];
  window.DURACAO = S[S.length - 1];

  // ---------------- imagens e fontes
  const img = {};
  const carregar = (k, src) => new Promise((ok) => { if (!src) return ok(); const i = new Image(); i.onload = () => { img[k] = i; ok(); }; i.onerror = () => ok(); i.src = "../" + src; });
  await Promise.all(E.map((e) => carregar(e.urna, e.foto)));
  await document.fonts.load("900 60px Inter"); await document.fonts.load("500 30px Inter");

  // ---------------- formas das partículas
  const N = 2200;
  const P = Array.from({ length: N }, () => ({ s: 0.8 + rnd() * 2.2, ph: rnd() * 6.283, d: rnd() * 0.35, a: 0.35 + rnd() * 0.65 }));
  const forma = {};
  const poeira = () => [rnd() * W, rnd() * H, "dust"];
  forma.poeira = Array.from({ length: N }, poeira);
  // 1 · candidatos: um ponto por candidato; os n eleitos acendem
  const nc = D.candidatos, cols = nc > 40 ? 9 : nc > 24 ? 6 : 5, rows = Math.ceil(nc / cols), gap = Math.min(150, 760 / Math.max(rows - 1, 1), 880 / (cols - 1));
  const CY = 1060, CAND = Array.from({ length: nc }, (_, i) => ({ x: W / 2 + ((i % cols) - (cols - 1) / 2) * gap, y: CY + (Math.floor(i / cols) - (rows - 1) / 2) * gap }));
  const rC = Math.max(10, gap * 0.26);
  const nuvem = (c, r, cor) => { const a = rnd() * 6.283, k = Math.sqrt(rnd()) * r; return [c.x + Math.cos(a) * k, c.y + Math.sin(a) * k, cor]; };
  forma.cand = Array.from({ length: N }, (_, i) => nuvem(CAND[i % nc], rC, "#fff"));
  forma.candEl = forma.cand.map((p, i) => [p[0], p[1], i % nc < n ? AC : "dim"]);
  // 2 · quociente: anel em volta do número
  forma.anel = Array.from({ length: N }, () => { const a = rnd() * 6.283, r = 330 + gauss() * 14; return [W / 2 + Math.cos(a) * r, 900 + Math.sin(a) * r, rnd() < 0.5 ? AC : "#fff"]; });
  // 3 · grade de rostos (linhas de 3 ou 4)
  const porLinha = n <= 9 ? 3 : 4, linhas = []; { let r = n; while (r > 0) { const k = Math.min(porLinha, r); linhas.push(k); r -= k; } if (linhas.length > 1 && linhas[linhas.length - 1] < linhas[linhas.length - 2] - 1) { linhas[linhas.length - 1]++; linhas[linhas.length - 2]--; } }
  const lg = linhas.length, dy = Math.min(330, 1180 / lg), GR = [], rF = Math.min(86, dy * 0.27);
  { let k = 0; linhas.forEach((m, li) => { for (let j = 0; j < m; j++) GR.push({ e: E[k++], x: W / 2 + (j - (m - 1) / 2) * 235, y: 530 + li * dy + (4 - lg) * dy * 0.35 }); }); }
  forma.grade = Array.from({ length: N }, (_, i) => { const g = GR[i % GR.length], a = rnd() * 6.283, r = rF + 14 + Math.abs(gauss()) * 14; return [g.x + Math.cos(a) * r, g.y + Math.sin(a) * r, g.e.eleito20 ? "#fff" : AC]; });
  // 4 · renovação: eleitos de 2020 (esquerda) × de 2024 (direita); as linhas ligam quem se reelegeu
  const RN = { x0: W * 0.25, x1: W * 0.75, y0: 560, gap: Math.min(84, 900 / Math.max(n, D.eleitos20)) };
  const re24 = E.map((e, j) => (e.eleito20 ? j : -1)).filter((j) => j >= 0);
  forma.renov = Array.from({ length: N }, (_, i) => { const lado = i % 2, j = Math.floor(i / 2) % (lado ? n : D.eleitos20); const ac = lado ? E[j].eleito20 : j < re24.length;
    return nuvem({ x: lado ? RN.x1 : RN.x0, y: RN.y0 + j * RN.gap }, 20, ac ? AC : lado ? "#fff" : "dim"); });
  // 5 · destaques: maior votação e quem mais cresceu
  const DST = D.cresceu ? [{ e: D.top, x: W * 0.29 }, { e: D.cresceu, x: W * 0.71 }] : [{ e: D.top, x: W / 2 }];
  const FY = 860;
  forma.dest = Array.from({ length: N }, (_, i) => { const d = DST[i % DST.length], a = rnd() * 6.283, r = 172 + Math.abs(gauss()) * 30; return [d.x + Math.cos(a) * r, FY + Math.sin(a) * r, i % DST.length ? "#fff" : AC]; });
  // 6 · fim: a cidade em partículas
  const poly = G.poly[D.cd_ibge] || [];
  const dentro = (x, y, pl) => { let c = false; for (let i = 0, j = pl.length - 1; i < pl.length; j = i++) { const [xi, yi] = pl[i], [xj, yj] = pl[j]; if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c; } return c; };
  forma.cidade = (() => { if (!poly.length) return forma.anel; const lons = poly.map((p) => p[0]), lats = poly.map((p) => p[1]); const [a, b, c, d] = [Math.min(...lons), Math.max(...lons), Math.min(...lats), Math.max(...lats)];
    const kx = Math.cos(((c + d) / 2) * Math.PI / 180), s = Math.min(760 / ((b - a) * kx), 720 / (d - c)) * (D.presidente ? 0.62 : 1), cx = (a + b) / 2, cy = (c + d) / 2, out = [];
    while (out.length < N) { const lon = a + rnd() * (b - a), lat = c + rnd() * (d - c); if (dentro(lon, lat, poly)) out.push([W / 2 + (lon - cx) * s * kx, (D.presidente ? 1090 : 1080) - (lat - cy) * s, rnd() < 0.3 ? AC : "#fff"]); } return out; })();

  const KF = [[0, "poeira", 0], [0.2, "cand", 1.6], [2.4, "candEl", 0.8], [S[1] + 0.1, "anel", 1.6], [S[2] + 0.1, "grade", 1.6], [S[3] + 0.1, "renov", 1.6], [S[4] + 0.1, "dest", 1.6], [S[5] + 0.1, "cidade", 1.8]];
  const posicao = (t) => { let k = 0; while (k + 1 < KF.length && t >= KF[k + 1][0]) k++; const [t0, nome, dur] = KF[k]; return { ant: k ? forma[KF[k - 1][1]] : forma[nome], cur: forma[nome], t0, dur }; };

  // ---------------- desenho
  const fundo = (t) => {
    const g = ctx.createRadialGradient(W / 2, H * 0.42, 50, W / 2, H * 0.5, H * 0.8);
    g.addColorStop(0, "#1b1c1a"); g.addColorStop(1, "#060606"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 9; i++) { const x = (i * 263 + t * 9 * (i % 3 + 1)) % (W + 200) - 100, y = (i * 517) % H + Math.sin(t * 0.3 + i) * 30, r = 50 + (i % 4) * 30;
      const b = ctx.createRadialGradient(x, y, 0, x, y, r); b.addColorStop(0, "rgba(255,255,255,.035)"); b.addColorStop(1, "rgba(255,255,255,0)"); ctx.fillStyle = b; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
  };
  const texto = (s, x, y, o = {}) => {
    const a = o.a == null ? 1 : o.a; if (a <= 0.01) return;
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = o.cor || "#f3f1ea"; ctx.textAlign = o.al || "center"; ctx.textBaseline = "alphabetic";
    let tam = o.tam || 56; ctx.font = `${o.w || 700} ${tam}px ${FONT}`; ctx.letterSpacing = (o.ls || 0) + "px";
    const larg = Math.max(...String(s).split("\n").map((l) => ctx.measureText(l).width)); if (larg > (o.max || 960)) { tam *= (o.max || 960) / larg; ctx.font = `${o.w || 700} ${tam}px ${FONT}`; }
    if (o.brilho) { ctx.shadowColor = o.cor || "rgba(255,255,255,.6)"; ctx.shadowBlur = o.brilho; }
    const dy = o.sobe ? (1 - a) * 24 : 0;
    String(s).split("\n").forEach((l, i) => ctx.fillText(l, x, y + dy + i * (o.lh || tam * 1.18)));
    ctx.restore();
  };
  const foto = (k, x, y, r, a, o = {}) => {
    if (a <= 0.01 || !img[k]) return;
    const s = 0.85 + 0.15 * eout(a);
    ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s, s);
    ctx.shadowColor = o.cor || "rgba(255,255,255,.35)"; ctx.shadowBlur = 40; ctx.beginPath(); ctx.arc(0, 0, r + 6, 0, 6.283); ctx.fillStyle = "#111"; ctx.fill(); ctx.shadowBlur = 0;
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.clip();
    const i = img[k], sc = Math.max((2 * r) / i.width, (2 * r) / i.height); ctx.drawImage(i, -i.width * sc / 2, -i.height * sc * 0.42, i.width * sc, i.height * sc); ctx.restore();
    ctx.lineWidth = 5; ctx.strokeStyle = o.cor || "rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, 6.283); ctx.stroke();
    ctx.restore();
  };
  // selo fixo da série no topo (gancho visual: "parte 1")
  const selo = (t) => { const a = 1 - prog(t, S[5] - 0.4, S[5]); if (a <= 0.01) return; ctx.save(); ctx.globalAlpha = a; ctx.font = `800 26px ${FONT}`; ctx.letterSpacing = "5px"; const s = `${D.municipio.toUpperCase()} · PARTE 1`, w = ctx.measureText(s).width + 44;
    ctx.fillStyle = AC; ctx.beginPath(); ctx.roundRect(W / 2 - w / 2, 96, w, 50, 25); ctx.fill(); ctx.fillStyle = "#0a0a0a"; ctx.textAlign = "center"; ctx.fillText(s, W / 2 + 2, 130); ctx.restore(); };
  const marca = () => { ctx.save(); ctx.font = `700 19px ${FONT}`; ctx.letterSpacing = "4px"; const s = "PLENÁRIA CE", w = ctx.measureText(s).width + 36; const x = W - w - 60, y = H - 120;
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(x, y, w, 40, 20); ctx.stroke(); ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.textAlign = "left"; ctx.fillText(s, x + 18, y + 27); ctx.restore(); };
  const particulas = (t) => {
    const { ant, cur, t0, dur } = posicao(t);
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < N; i++) {
      const p = P[i], k = dur ? ease(clamp(((t - t0) / dur - p.d) / (1 - 0.35))) : 1, a0 = ant[i], a1 = cur[i];
      let x = lerp(a0[0], a1[0], k) + Math.sin(t * 0.9 + p.ph) * 1.6, y = lerp(a0[1], a1[1], k) + Math.cos(t * 0.8 + p.ph) * 1.6;
      const curva = Math.sin(k * Math.PI) * 60 * (p.d - 0.17); x += curva; y -= curva * 0.6;
      const c = (k > 0.5 ? a1[2] : a0[2]) || "#fff";
      let al = p.a * (0.55 + 0.45 * Math.sin(t * 2 + p.ph * 3) ** 2);
      if (c === "dust") al *= 0.14; else if (c === "dim") al *= 0.22;
      ctx.globalAlpha = clamp(al); ctx.fillStyle = c === "dust" || c === "dim" ? "#fff" : c;
      ctx.beginPath(); ctx.arc(x, y, p.s, 0, 6.283); ctx.fill();
      if (dur && k > 0 && k < 1) { const k2 = ease(clamp(((t - 0.06 - t0) / dur - p.d) / (1 - 0.35))), xb = lerp(a0[0], a1[0], k2), yb = lerp(a0[1], a1[1], k2);
        if (Math.hypot(x - xb, y - yb) > 3) { ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = p.s * 0.9; ctx.globalAlpha = clamp(al * 0.3); ctx.beginPath(); ctx.moveTo(xb, yb); ctx.lineTo(x, y); ctx.stroke(); } }
    }
    ctx.restore();
  };
  const curto = (s) => (s.length > 16 ? s.replace(/^Professora /, "Prof. ").replace(/^Dra /, "Dra. ") : s);

  window.render = (t) => {
    ctx.clearRect(0, 0, W, H); fundo(t);
    // linhas da renovação (antes das partículas)
    if (t > S[3] && t < S[4] + 0.1) { ctx.save(); ctx.globalAlpha = vis(t, S[3] + 1.6, S[4]) * 0.9; ctx.strokeStyle = AC; ctx.lineWidth = 3; ctx.shadowColor = AC; ctx.shadowBlur = 12;
      re24.forEach((j, i) => { const k = eout(prog(t, S[3] + 1.8 + i * 0.25, S[3] + 2.8 + i * 0.25)), y0 = RN.y0 + i * RN.gap, y1 = RN.y0 + j * RN.gap; ctx.beginPath(); ctx.moveTo(RN.x0 + 28, y0); ctx.lineTo(lerp(RN.x0 + 28, RN.x1 - 28, k), lerp(y0, y1, k)); ctx.stroke(); }); ctx.restore(); }
    particulas(t);
    selo(t);

    // 1 · gancho
    texto(fmt(D.candidatos * eout(prog(t, 0.1, 1.2))), W / 2, 380, { tam: 170, w: 900, a: vis(t, 0, S[1]), brilho: 26 });
    texto("CANDIDATOS", W / 2, 450, { tam: 44, w: 800, ls: 10, a: vis(t, 0.2, S[1]) });
    texto(`${n} CADEIRAS`, W / 2, 560, { tam: 76, w: 900, ls: 4, a: vis(t, 2.2, S[1]), cor: AC, brilho: 22, sobe: 1 });
    texto("Quantos votos vale\numa vaga na Câmara?", W / 2, 1640, { tam: 58, w: 800, a: vis(t, 3.0, S[1]), sobe: 1, lh: 70 });
    // 2 · quociente
    texto("QUOCIENTE ELEITORAL · 2024", W / 2, 360, { tam: 34, w: 700, ls: 6, a: vis(t, S[1] + 0.2, S[2]), cor: CINZA });
    texto(`${fmt(D.validos)} votos ÷ ${n}`, W / 2, 460, { tam: 56, w: 700, a: vis(t, S[1] + 0.5, S[2]), sobe: 1 });
    texto(fmt(D.qe * eout(prog(t, S[1] + 1.4, S[1] + 3.0))), W / 2, 950, { tam: 190, w: 900, a: vis(t, S[1] + 1.2, S[2]), brilho: 28, cor: AC });
    texto("votos por cadeira", W / 2, 1030, { tam: 44, w: 600, a: vis(t, S[1] + 1.6, S[2]) });
    // 3 · os eleitos
    texto(`OS ${n} ELEITOS DE 2024`, W / 2, 300, { tam: 40, w: 800, ls: 6, a: vis(t, S[2] + 0.2, S[3]) });
    GR.forEach((g, i) => { const a = vis(t, S[2] + 0.4 + i * 0.12, S[3]); foto(g.e.urna, g.x, g.y, rF, a, { cor: g.e.eleito20 ? "rgba(255,255,255,.85)" : AC });
      texto(curto(g.e.urna), g.x, g.y + rF + 44, { tam: 26, w: 700, a, max: 225 });
      texto(fmt(g.e.votos * eout(prog(t, S[2] + 1.2 + i * 0.1, S[2] + 3 + i * 0.1))), g.x, g.y + rF + 84, { tam: 36, w: 900, a, cor: g.e.eleito20 ? "#fff" : AC }); });
    texto("votos de cada um · TSE", W / 2, 1780, { tam: 26, w: 500, a: vis(t, S[2] + 1, S[3]), cor: "#8d8b82" });
    // 4 · renovação
    texto("2020", RN.x0, 480, { tam: 44, w: 900, a: vis(t, S[3] + 0.3, S[4]), cor: CINZA }); texto("2024", RN.x1, 480, { tam: 44, w: 900, a: vis(t, S[3] + 0.3, S[4]) });
    texto(`${D.novos} DE ${n}`, W / 2, 300, { tam: 100, w: 900, a: vis(t, S[3] + 1.2, S[4]), brilho: 22, cor: AC, sobe: 1 });
    texto(`não tinham sido eleitos em 2020`, W / 2, 380, { tam: 40, w: 600, a: vis(t, S[3] + 1.5, S[4]), sobe: 1 });
    texto(`${D.reeleitos === 1 ? "só 1 se reelegeu" : D.reeleitos + " se reelegeram"}`, W / 2, 1640, { tam: 52, w: 800, a: vis(t, S[3] + 2.4, S[4]), sobe: 1 });
    // 5 · destaques
    texto("MAIOR VOTAÇÃO", DST[0].x, 560, { tam: 32, w: 800, ls: 4, a: vis(t, S[4] + 0.3, S[5]), cor: AC });
    foto(D.top.urna, DST[0].x, FY, 140, vis(t, S[4] + 0.4, S[5]), { cor: AC });
    texto(curto(D.top.urna), DST[0].x, FY + 220, { tam: 36, w: 800, a: vis(t, S[4] + 0.6, S[5]), max: DST.length > 1 ? 470 : 900 });
    texto(fmt(D.top.votos * eout(prog(t, S[4] + 0.6, S[4] + 2))), DST[0].x, FY + 310, { tam: 80, w: 900, a: vis(t, S[4] + 0.6, S[5]), cor: AC, brilho: 18 });
    if (D.cresceu) { const c = D.cresceu, x = DST[1].x, a0 = S[4] + 3.4;
      texto("MAIS CRESCEU", x, 560, { tam: 32, w: 800, ls: 4, a: vis(t, a0, S[5]) });
      foto(c.urna, x, FY, 140, vis(t, a0 + 0.1, S[5]));
      texto(curto(c.urna), x, FY + 220, { tam: 36, w: 800, a: vis(t, a0 + 0.3, S[5]), max: 470 });
      texto(`${fmt(c.v20)} → ${fmt(lerp(c.v20, c.votos, eout(prog(t, a0 + 0.6, a0 + 2))))}`, x, FY + 310, { tam: 60, w: 900, a: vis(t, a0 + 0.3, S[5]) });
      texto("2020 → 2024", x, FY + 360, { tam: 26, w: 600, a: vis(t, a0 + 0.5, S[5]), cor: "#8d8b82" }); }
    // 6 · pergunta e assinatura (com o presidente atual da Câmara, quando confirmado)
    const fim = (a, b) => vis(t, S[5] + a, S[6] + 1, 0.5) * (b || 1);
    if (D.presidente) {
      texto("PRESIDENTE DA CÂMARA HOJE", W / 2, 300, { tam: 32, w: 800, ls: 5, a: fim(0.2), cor: CINZA });
      foto(D.presidente.urna, W / 2, 560, 150, fim(0.3), { cor: AC });
      texto(D.presidente.urna, W / 2, 790, { tam: 50, w: 900, a: fim(0.5) });
      texto("E o próximo presidente,\nquem será?", W / 2, 1420, { tam: 66, w: 900, a: fim(1.4), sobe: 1, lh: 80, brilho: 10 });
    } else texto("Qual vereador você quer\nver no próximo vídeo?", W / 2, 330, { tam: 64, w: 900, a: fim(0.3), sobe: 1, lh: 78 });
    texto("COMENTA AQUI ↓", W / 2, 1640, { tam: 50, w: 900, ls: 6, a: fim(D.presidente ? 2.2 : 1.2, 0.75 + 0.25 * Math.sin(t * 6)), cor: AC, brilho: 20 });
    texto("PLENÁRIA CE", W / 2, 1730, { tam: 34, w: 800, ls: 8, a: fim(1.6) });
    texto("Fonte: TSE · vereadores 2020 e 2024", W / 2, 1780, { tam: 22, w: 500, a: fim(1.8), cor: "#8d8b82" });
    if (t < S[5]) marca();
  };
  window.render(0);
  window.pronto = true;
})();
</script>
</body>
</html>
