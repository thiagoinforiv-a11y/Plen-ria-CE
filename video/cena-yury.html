<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Raio-X: Yury do Paredão em Varjota</title>
<style>html, body { margin: 0; background: #070707; } canvas { display: block; width: 540px; height: 960px; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="efeitos.js"></script>
<script>
/* Raio-X "Yury do Paredão em Varjota (2026)" no estilo de partículas do raio-X da cidade. Só dados do TSE (dados-yury.json). */
(async () => {
  const W = 1080, H = 1920, ctx = document.getElementById("c").getContext("2d");
  const D = await (await fetch("dados-yury.json")).json(), G = await (await fetch("geo.json")).json();
  const AC = "#d4ff3a", LR = "#ff7a45", FONT = "Inter, 'Inter Display', sans-serif", CINZA = "#bdbab0";
  const fmt = (n) => Math.round(n).toLocaleString("pt-BR"), pc = (x, d = 1) => (x * 100).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%";
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k;
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2), eout = (x) => 1 - Math.pow(1 - x, 3);
  const prog = (t, a, b) => clamp((t - a) / (b - a)), vis = (t, a, b, f = 0.45) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
  let seed = 3; const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const S = [0, 5.6, 12, 19, 27, 36, 44, 52, 58, 64]; window.DURACAO = S[S.length - 1];
  // projeção
  const CE = { lon: -39.35, lat: -5.25, s: 205 }, VJ = { lon: -40.52, lat: -4.172, s: 4700 }, kx = Math.cos((4.5 * Math.PI) / 180);
  const proj = (lon, lat, v, cy = H * 0.5) => [W / 2 + (lon - v.lon) * v.s * kx, cy - (lat - v.lat) * v.s];
  const camera = (t) => { const k = ease(prog(t, 5.6, 8.4)); return { lon: lerp(CE.lon, VJ.lon, k), lat: lerp(CE.lat, VJ.lat, k), s: Math.exp(lerp(Math.log(CE.s), Math.log(VJ.s), k)) }; };
  const dentro = (x, y, p) => { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c; } return c; };
  const MAPY = H * 0.52, vj = G.varjota;
  // imagens
  const img = {}; const carregar = (k, src) => new Promise((ok) => { if (!src) return ok(); const i = new Image(); i.onload = () => { img[k] = i; ok(); }; i.onerror = ok; i.src = "../" + src; });
  await Promise.all(D.top3.map((c) => carregar(c.urna, c.foto)));
  await document.fonts.load("900 60px Inter"); await document.fonts.load("500 30px Inter");
  // formas
  const N = 2400, P = Array.from({ length: N }, () => ({ s: 0.8 + rnd() * 2.2, ph: rnd() * 6.283, d: rnd() * 0.35, a: 0.35 + rnd() * 0.65 }));
  const poeira = () => [rnd() * W, rnd() * H, "dust"], forma = {};
  forma.poeira = Array.from({ length: N }, () => [rnd() * W, rnd() * H]);
  const amostraVJ = (v, cy, cor) => { const out = []; const lo = vj.map((p) => p[0]), la = vj.map((p) => p[1]); const [a, b, c, d] = [Math.min(...lo), Math.max(...lo), Math.min(...la), Math.max(...la)];
    while (out.length < N) { const lon = a + rnd() * (b - a), lat = c + rnd() * (d - c); if (dentro(lon, lat, vj)) out.push([...proj(lon, lat, v, cy), cor]); } return out; };
  forma.vjPequena = amostraVJ(CE, MAPY); forma.vjCheia = amostraVJ(VJ, MAPY);
  const FY = 820; // halo da foto
  forma.halo = Array.from({ length: N }, (_, i) => { const a = rnd() * 6.283, r = 230 + Math.abs(gauss()) * 40, dentroDo = i < N * D.pct; return [W / 2 + Math.cos(a) * r, FY + Math.sin(a) * r, dentroDo ? LR : "dust"]; });
  // colunas: top 3, cada ponto = 10 votos
  const CX = [W * 0.25, W * 0.5, W * 0.75], BASE = 1500, GAP = 14, PER = 12;
  forma.colunas = (() => { const out = []; D.top3.forEach((c, j) => { const n = Math.round(c.votos / 10); for (let k = 0; k < n; k++) out.push([CX[j] - ((PER - 1) * GAP) / 2 + (k % PER) * GAP, BASE - Math.floor(k / PER) * GAP, j ? "#fff" : LR]); }); while (out.length < N) out.push(poeira()); return out.slice(0, N); })();
  // nuvens no mapa: uma por local, tamanho pelos votos
  const LOC = D.locais.filter((l) => l.lat && l.lon).map((l) => ({ ...l, xy: proj(l.lon, l.lat, VJ, MAPY) })), totV = LOC.reduce((a, l) => a + l.v, 0);
  forma.nuvens = (() => { const out = []; LOC.forEach((l) => { const n = Math.round((N * l.v) / totV), r = 10 + Math.sqrt(l.v) * 2.2; for (let k = 0; k < n; k++) { const a = rnd() * 6.283, rr = Math.sqrt(rnd()) * r; out.push([l.xy[0] + Math.cos(a) * rr, l.xy[1] + Math.sin(a) * rr, l.pct > 0.25 ? AC : LR]); } }); while (out.length < N) out.push(poeira()); return out.slice(0, N); })();
  // top 5 locais: barras de pontos
  const T5 = D.locais.slice(0, 5), BY = 560, BG = 230, BX = 120, BW = 840, vmax = T5[0].v;
  forma.top5 = (() => { const out = []; const tot = T5.reduce((a, l) => a + l.v, 0); T5.forEach((l, i) => { const n = Math.round((N * 0.9 * l.v) / tot); for (let k = 0; k < n; k++) out.push([BX + rnd() * BW * (l.v / vmax), BY + i * BG + 40 + gauss() * 8, i === 0 ? LR : "#fff"]); }); while (out.length < N) out.push(poeira()); return out.slice(0, N); })();
  // urnas: 59 nuvenzinhas em grade, brilho pelo % do Yury
  const PU = [...D.locais.flatMap((l) => Array(l.urnas).fill(l.pct))].sort((a, b) => b - a), UC = 8, UG = 112;
  const UXY = PU.map((p, i) => [W / 2 + ((i % UC) - (UC - 1) / 2) * UG, 520 + Math.floor(i / UC) * UG]);
  forma.urnas = Array.from({ length: N }, (_, i) => { const j = i % UXY.length, a = rnd() * 6.283, r = Math.sqrt(rnd()) * (16 + PU[j] * 90); return [UXY[j][0] + Math.cos(a) * r, UXY[j][1] + Math.sin(a) * r, PU[j] > 0.25 ? AC : LR]; });
  // destaque: maior proporção
  const BAI = Object.entries(LOC.reduce((o, l) => ((o[l.bairro] = (o[l.bairro] || 0) + l.v), o), {})).sort((a, b) => b[1] - a[1]);
  const MX = LOC.reduce((a, b) => (b.pct > a.pct ? b : a));
  forma.destaque = Array.from({ length: N }, (_, i) => { if (i < N * 0.55) { const a = rnd() * 6.283, r = 60 + Math.abs(gauss()) * 50; return [MX.xy[0] + Math.cos(a) * r, MX.xy[1] + Math.sin(a) * r, AC]; } return forma.vjCheia[i].slice(0, 2).concat("dust"); });
  const CEF = { lon: -39.35, lat: -5.25, s: 190 };
  forma.ceara = (() => { const vs = G.mun.flat(), out = []; for (let i = 0; i < N; i++) { const [lon, lat] = vs[Math.floor(rnd() * vs.length)]; const [x, y] = proj(lon, lat, CEF, H * 0.5); out.push([x + gauss() * 2, y + gauss() * 2]); } return out; })();
  const KF = [[0, "poeira", 0], [2.2, "vjPequena", 2.2], [6.0, "vjCheia", 2.4], [S[2] + 0.2, "halo", 2.0], [S[3] + 0.2, "colunas", 2.0], [S[4] + 0.2, "nuvens", 2.2], [S[5] + 0.2, "top5", 1.8], [S[6] + 0.2, "urnas", 2.0], [S[7] + 0.2, "destaque", 1.8], [S[8] + 0.2, "ceara", 2.4]];
  const posicao = (t) => { let k = 0; while (k + 1 < KF.length && t >= KF[k + 1][0]) k++; const [t0, nome, dur] = KF[k]; return { ant: k ? forma[KF[k - 1][1]] : forma[nome], cur: forma[nome], t0, dur }; };
  // desenho
  const fundo = (t) => { const g = ctx.createRadialGradient(W / 2, H * 0.42, 50, W / 2, H * 0.5, H * 0.8); g.addColorStop(0, "#1b1c1a"); g.addColorStop(1, "#060606"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
  const texto = (s, x, y, o = {}) => { const a = o.a == null ? 1 : o.a; if (a <= 0.01) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = o.cor || "#f3f1ea"; ctx.textAlign = o.al || "center";
    let tam = o.tam || 56; ctx.font = `${o.w || 700} ${tam}px ${FONT}`; ctx.letterSpacing = (o.ls || 0) + "px"; const ls = String(s).split("\n"), lg = Math.max(...ls.map((l) => ctx.measureText(l).width));
    if (lg > (o.max || 980)) { tam *= (o.max || 980) / lg; ctx.font = `${o.w || 700} ${tam}px ${FONT}`; } if (o.brilho) { ctx.shadowColor = o.cor || "rgba(255,255,255,.6)"; ctx.shadowBlur = o.brilho; }
    const dy = o.sobe ? (1 - a) * 24 : 0; ls.forEach((l, i) => ctx.fillText(l, x, y + dy + i * (o.lh || tam * 1.18))); ctx.restore(); };
  const foto = (k, x, y, r, a, cor) => { if (a <= 0.01 || !img[k]) return; const s = 0.85 + 0.15 * eout(a); ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s, s);
    ctx.shadowColor = cor || "rgba(255,255,255,.35)"; ctx.shadowBlur = 40; ctx.beginPath(); ctx.arc(0, 0, r + 6, 0, 6.283); ctx.fillStyle = "#111"; ctx.fill(); ctx.shadowBlur = 0;
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.clip(); const i = img[k], sc = Math.max((2 * r) / i.width, (2 * r) / i.height); ctx.drawImage(i, -i.width * sc / 2, -i.height * sc * 0.42, i.width * sc, i.height * sc); ctx.restore();
    ctx.lineWidth = 5; ctx.strokeStyle = cor || "rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, 6.283); ctx.stroke(); ctx.restore(); };
  const marca = () => { ctx.save(); ctx.font = `700 19px ${FONT}`; ctx.letterSpacing = "4px"; const s = "PLENÁRIA CE", w = ctx.measureText(s).width + 36, x = W - w - 60, y = H - 120;
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(x, y, w, 40, 20); ctx.stroke(); ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.textAlign = "left"; ctx.fillText(s, x + 18, y + 27); ctx.restore(); };
  const contornos = (t, v, cy, a, realce) => { if (a <= 0.01) return; ctx.save(); ctx.lineWidth = 1.4; ctx.strokeStyle = `rgba(255,255,255,${0.16 * a})`; const k = prog(t, 0.2, 2.4);
    G.mun.forEach((r, ri) => { if (ri / G.mun.length > k * 1.02) return; ctx.beginPath(); r.forEach(([lon, lat], i) => { const [x, y] = proj(lon, lat, v, cy); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.stroke(); });
    if (realce > 0) { ctx.beginPath(); vj.forEach(([lon, lat], i) => { const [x, y] = proj(lon, lat, v, cy); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.shadowColor = AC; ctx.shadowBlur = 24 * realce; ctx.strokeStyle = `rgba(212,255,58,${0.9 * realce})`; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = `rgba(212,255,58,${0.06 * realce})`; ctx.fill(); }
    ctx.restore(); };
  const particulas = (t) => { const { ant, cur, t0, dur } = posicao(t); ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < N; i++) { const p = P[i], k = dur ? ease(clamp(((t - t0) / dur - p.d) / 0.65)) : 1, a0 = ant[i], a1 = cur[i];
      let x = lerp(a0[0], a1[0], k) + Math.sin(t * 0.9 + p.ph) * 1.6, y = lerp(a0[1], a1[1], k) + Math.cos(t * 0.8 + p.ph) * 1.6; const cv = Math.sin(k * Math.PI) * 60 * (p.d - 0.17); x += cv; y -= cv * 0.6;
      const c = (k > 0.5 ? a1[2] : a0[2]) || "#fff"; let al = p.a * (0.55 + 0.45 * Math.sin(t * 2 + p.ph * 3) ** 2); if (c === "dust") al *= 0.14;
      ctx.globalAlpha = clamp(al); ctx.fillStyle = c === "dust" ? "#fff" : c; ctx.beginPath(); ctx.arc(x, y, p.s, 0, 6.283); ctx.fill();
      if (dur && k > 0 && k < 1) { const k2 = ease(clamp(((t - 0.06 - t0) / dur - p.d) / 0.65)), xb = lerp(a0[0], a1[0], k2), yb = lerp(a0[1], a1[1], k2); if (Math.hypot(x - xb, y - yb) > 3) { ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = p.s * 0.9; ctx.globalAlpha = clamp(al * 0.3); ctx.beginPath(); ctx.moveTo(xb, yb); ctx.lineTo(x, y); ctx.stroke(); } } }
    ctx.restore(); };
  window.render = (t) => {
    ctx.clearRect(0, 0, W, H); fundo(t);
    const cam = camera(t), aMapa = t < S[2] ? 1 - prog(t, S[2] - 1, S[2]) : t > S[4] && t < S[5] ? vis(t, S[4], S[5]) : t > S[7] && t < S[8] ? vis(t, S[7], S[8]) : 0;
    contornos(t, t < S[2] ? cam : VJ, MAPY, aMapa, (t < S[2] ? prog(t, 1.6, 3.2) : 1) * aMapa);
    if (t > S[8] - 0.2) contornos(t, CEF, H * 0.5, prog(t, S[8], S[8] + 2), prog(t, S[8] + 2, S[8] + 3.5));
    particulas(t);
    // 0 · abertura
    texto("VARJOTA", W / 2, 330, { tam: 118, w: 900, ls: 14, a: vis(t, 0.8, S[1]), brilho: 30, sobe: 1 });
    texto("RAIO-X · YURY DO PAREDÃO · 2026", W / 2, 400, { tam: 30, w: 600, ls: 7, a: vis(t, 1.4, S[1]), cor: LR });
    // 1 · deputado federal
    texto("2026 · DEPUTADO FEDERAL", W / 2, 300, { tam: 36, w: 700, ls: 8, a: vis(t, S[1] + 0.6, S[2]), cor: CINZA });
    texto(`${D.urnas} urnas · ${fmt(D.validos)} votos válidos`, W / 2, 1640, { tam: 40, w: 600, a: vis(t, S[1] + 1.4, S[2]), sobe: 1 });
    // 2 · foto e total
    texto("O MAIS VOTADO DA CIDADE", W / 2, 360, { tam: 38, w: 800, ls: 6, a: vis(t, S[2] + 0.3, S[3]), cor: CINZA });
    foto(D.top3[0].urna, W / 2, FY, 170, vis(t, S[2] + 0.5, S[3]), LR);
    texto(fmt(D.votos * eout(prog(t, S[2] + 1, S[2] + 2.6))), W / 2, 1190, { tam: 150, w: 900, a: vis(t, S[2] + 0.8, S[3]), brilho: 26, cor: LR });
    texto(`votos · ${pc(D.pct)} dos válidos`, W / 2, 1260, { tam: 42, w: 600, a: vis(t, S[2] + 1.2, S[3]) });
    // 3 · colunas
    texto("OS 3 MAIS VOTADOS PARA FEDERAL", W / 2, 300, { tam: 34, w: 800, ls: 4, a: vis(t, S[3] + 0.3, S[4]), cor: CINZA });
    texto("cada ponto = 10 votos", W / 2, 350, { tam: 28, w: 500, a: vis(t, S[3] + 0.5, S[4]), cor: "#8d8b82" });
    D.top3.forEach((c, j) => { const a = vis(t, S[3] + 0.6 + j * 0.3, S[4]), topo = BASE - Math.floor(Math.round(c.votos / 10) / PER) * GAP; foto(c.urna, CX[j], topo - 110, j ? 62 : 80, a, j ? null : LR);
      texto(fmt(c.votos * eout(prog(t, S[3] + 1, S[3] + 2.6))), CX[j], BASE + 80, { tam: 54, w: 900, a, cor: j ? "#fff" : LR }); texto(c.urna, CX[j], BASE + 124, { tam: 26, w: 600, a, max: 300 }); });
    // 4 · mapa
    texto("DE ONDE VIERAM OS VOTOS", W / 2, 300, { tam: 36, w: 800, ls: 5, a: vis(t, S[4] + 0.3, S[5]), cor: CINZA });
    texto("cada nuvem é um local de votação", W / 2, 350, { tam: 28, w: 500, a: vis(t, S[4] + 0.5, S[5]), cor: "#8d8b82" });
    texto(BAI.slice(0, 3).map(([b, v]) => `${b} ${fmt(v)}`).join("  ·  "), W / 2, 1560, { tam: 32, w: 700, a: vis(t, S[4] + 2.4, S[5]), cor: LR, sobe: 1 });
    texto("Voto espalhado: forte na sede\ne também no interior", W / 2, 1650, { tam: 42, w: 700, a: vis(t, S[4] + 3, S[5]), sobe: 1, lh: 54 });
    // 5 · top 5
    texto("OS 5 LOCAIS COM MAIS VOTOS", W / 2, 360, { tam: 36, w: 800, ls: 5, a: vis(t, S[5] + 0.3, S[6]), cor: CINZA });
    T5.forEach((l, i) => { const a = vis(t, S[5] + 0.6 + i * 0.2, S[6]), y = BY + i * BG; texto(l.curto, BX, y, { tam: 34, w: 800, al: "left", a, max: 700 }); texto(l.bairro, BX, y + 4 + 34, { tam: 24, w: 500, al: "left", a, cor: "#8d8b82" });
      texto(`${l.v}`, BX + BW * (l.v / vmax) + 20, y + 54, { tam: 40, w: 900, al: "left", a, cor: i ? "#fff" : LR }); });
    // 6 · urnas
    texto(`VOTO EM ${D.comVoto} DE ${D.urnas} URNAS`, W / 2, 330, { tam: 52, w: 900, a: vis(t, S[6] + 0.3, S[7]), brilho: 16, sobe: 1 });
    texto(`cada nuvem é uma urna · verde = mais de 25%`, W / 2, 390, { tam: 28, w: 500, a: vis(t, S[6] + 0.5, S[7]), cor: "#8d8b82" });
    texto(`mínimo ${pc(D.min)} · mediana ${pc(D.mediana)} · máximo ${pc(D.max)}`, W / 2, 1520, { tam: 36, w: 700, a: vis(t, S[6] + 1.5, S[7]), sobe: 1 });
    texto("Em nenhuma urna ele ficou abaixo de 10%", W / 2, 1610, { tam: 42, w: 800, a: vis(t, S[6] + 2.2, S[7]), cor: AC, sobe: 1 });
    // 7 · destaque
    texto("ONDE ELE FOI MAIS FORTE", W / 2, 300, { tam: 36, w: 800, ls: 5, a: vis(t, S[7] + 0.3, S[8]), cor: CINZA });
    texto(MX.bairro.replace(/Olho D[áa]gua/, "Olho d'Água").replace('Acampamento Dnocs','Acampamento DNOCS'), W / 2, 1460, { tam: 64, w: 900, a: vis(t, S[7] + 0.8, S[8]), cor: AC, brilho: 18, sobe: 1 });
    texto(`${pc(MX.pct)} dos votos do local · ${pc(D.max)} numa urna`, W / 2, 1540, { tam: 38, w: 700, a: vis(t, S[7] + 1.2, S[8]), sobe: 1 });
    // 8 · fim
    texto("Voto de marca\nou de liderança?", W / 2, 330, { tam: 78, w: 900, a: vis(t, S[8] + 0.2, S[9] + 1, 0.6), sobe: 1, lh: 92 });
    texto("PLENÁRIA CE", W / 2, 1620, { tam: 54, w: 900, ls: 8, a: vis(t, S[8] + 1.8, S[9] + 1, 0.6), brilho: 20 });
    texto("Fonte: TSE · votação por seção, deputado federal 2026", W / 2, 1690, { tam: 23, w: 500, a: vis(t, S[8] + 2, S[9] + 1, 0.6), cor: "#8d8b82" });
    if (t < S[8]) marca();
  };
  window.render(0); window.pronto = true;
})();
</script>
</body>
</html>
