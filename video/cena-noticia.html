<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Vídeo-notícia</title>
<style>
  html, body { margin: 0; background: #070707; }
  canvas { display: block; width: 540px; height: 960px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Vídeo-notícia do @plenariace (canal sem apresentador): cartões animados sobre partículas, desenhados quadro a quadro.
 * Dados em video/noticias/<pauta>.json: cenas do tipo numero | texto | lados | pergunta, cada uma com a "fala" da narração.
 * Uso: gravar.mjs --cena "cena-noticia.html?d=noticias/<pauta>.json". Tom neutro: fala atribuída e fonte sempre na tela. */
(async () => {
  const W = 1080, H = 1920, cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const D = await (await fetch(new URLSearchParams(location.search).get("d"))).json();
  const AC = "#d4ff3a", AZ = "#3d6bff", FONT = "Inter, 'Inter Display', sans-serif", CINZA = "#bdbab0";
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, k) => a + (b - a) * k;
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const vis = (t, a, b, f = 0.4) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
  let seed = 5; const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const S = D.S, C = D.cenas;
  window.DURACAO = S[S.length - 1];
  await document.fonts.load("900 60px Inter"); await document.fonts.load("500 30px Inter");

  // partículas: cada tipo de cena tem uma forma
  const N = 1800, P = Array.from({ length: N }, () => ({ s: 0.8 + rnd() * 2.2, ph: rnd() * 6.283, d: rnd() * 0.35, a: 0.35 + rnd() * 0.65 }));
  const poeira = () => [rnd() * W, rnd() * H, "dust"];
  const anel = (cy, r, cor2) => Array.from({ length: N }, () => { const a = rnd() * 6.283, k = r + gauss() * 14; return [W / 2 + Math.cos(a) * k, cy + Math.sin(a) * k * 0.92, rnd() < 0.5 ? AC : cor2 || "#fff"]; });
  const faixa = (y) => Array.from({ length: N }, () => [rnd() * W, y + gauss() * 60, rnd() < 0.35 ? AC : "#fff"]);
  const lados = () => Array.from({ length: N }, (_, i) => { const e = i % 2 === 0, a = rnd() * 6.283, r = 190 + Math.abs(gauss()) * 26; return [(e ? W * 0.27 : W * 0.73) + Math.cos(a) * r, 900 + Math.sin(a) * r * 1.5, e ? AZ : AC]; });
  const forma = { poeira: Array.from({ length: N }, poeira) };
  const KF = [[0, "poeira", 0]];
  C.forEach((c, k) => { const nome = "c" + k; forma[nome] = c.tipo === "numero" ? anel(880, 360) : c.tipo === "lados" ? lados() : c.tipo === "pergunta" ? anel(860, 420, AZ) : faixa(1180); KF.push([k ? S[k] - 0.35 : 0.1, nome, 1.5]); });
  const posicao = (t) => { let k = 0; while (k + 1 < KF.length && t >= KF[k + 1][0]) k++; const [t0, nome, dur] = KF[k]; return { ant: k ? forma[KF[k - 1][1]] : forma[nome], cur: forma[nome], t0, dur }; };

  const fundo = (t) => { const g = ctx.createRadialGradient(W / 2, H * 0.42, 50, W / 2, H * 0.5, H * 0.8); g.addColorStop(0, "#1b1c1a"); g.addColorStop(1, "#060606"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
  const texto = (s, x, y, o = {}) => {
    const a = o.a == null ? 1 : o.a; if (a <= 0.01) return;
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = o.cor || "#f3f1ea"; ctx.textAlign = o.al || "center"; ctx.textBaseline = "alphabetic";
    let tam = o.tam || 56; ctx.font = `${o.w || 700} ${tam}px ${FONT}`; ctx.letterSpacing = (o.ls || 0) + "px";
    const ls = String(s).split("\n"), larg = Math.max(...ls.map((l) => ctx.measureText(l).width)); if (larg > (o.max || 960)) { tam *= (o.max || 960) / larg; ctx.font = `${o.w || 700} ${tam}px ${FONT}`; }
    if (o.brilho) { ctx.shadowColor = o.cor || "rgba(255,255,255,.6)"; ctx.shadowBlur = o.brilho; }
    const dy = o.sobe ? (1 - a) * 24 : 0, lh = o.lh || tam * 1.18;
    ls.forEach((l, i) => ctx.fillText(l, x, y + dy + i * lh));
    ctx.restore();
  };
  const particulas = (t) => {
    const { ant, cur, t0, dur } = posicao(t);
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < N; i++) {
      const p = P[i], k = dur ? ease(clamp(((t - t0) / dur - p.d) / 0.65)) : 1, a0 = ant[i], a1 = cur[i];
      let x = lerp(a0[0], a1[0], k) + Math.sin(t * 0.9 + p.ph) * 2, y = lerp(a0[1], a1[1], k) + Math.cos(t * 0.8 + p.ph) * 2;
      const curva = Math.sin(k * Math.PI) * 60 * (p.d - 0.17); x += curva; y -= curva * 0.6;
      const c = (k > 0.5 ? a1[2] : a0[2]) || "#fff"; let al = p.a * (0.55 + 0.45 * Math.sin(t * 2 + p.ph * 3) ** 2); if (c === "dust") al *= 0.14;
      ctx.globalAlpha = clamp(al); ctx.fillStyle = c === "dust" ? "#fff" : c; ctx.beginPath(); ctx.arc(x, y, p.s, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  };
  const selo = (a) => { if (a <= 0.01) return; ctx.save(); ctx.globalAlpha = a; ctx.font = `800 26px ${FONT}`; ctx.letterSpacing = "5px"; const s = D.selo || "PLENÁRIA CE", w = ctx.measureText(s).width + 44;
    ctx.fillStyle = AC; ctx.beginPath(); ctx.roundRect(W / 2 - w / 2, 96, w, 50, 25); ctx.fill(); ctx.fillStyle = "#0a0a0a"; ctx.textAlign = "center"; ctx.fillText(s, W / 2 + 2, 130); ctx.restore(); };
  const marca = () => { ctx.save(); ctx.font = `700 19px ${FONT}`; ctx.letterSpacing = "4px"; const s = "PLENÁRIA CE", w = ctx.measureText(s).width + 36; const x = W - w - 60, y = H - 120;
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(x, y, w, 40, 20); ctx.stroke(); ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.textAlign = "left"; ctx.fillText(s, x + 18, y + 27); ctx.restore(); };
  const caixa = (x, y, w, h, cor, a) => { ctx.save(); ctx.globalAlpha = a * 0.9; ctx.fillStyle = "rgba(10,10,10,.75)"; ctx.strokeStyle = cor; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(x, y, w, h, 18); ctx.fill(); ctx.stroke(); ctx.restore(); };

  const cena = (c, t, a, b) => {
    const v = (d, f) => vis(t, a + d, b, f);
    if (c.tipo === "numero") {
      texto(c.topo, W / 2, 330, { tam: 36, w: 800, ls: 6, a: v(0.2), cor: CINZA });
      texto(c.grande, W / 2, 940, { tam: 200, w: 900, a: v(0.4), brilho: 28, cor: AC, sobe: 1, max: 900 });
      texto(c.sub, W / 2, 1040, { tam: 56, w: 900, ls: 10, a: v(0.7), sobe: 1 });
      texto(c.rodape, W / 2, 1560, { tam: 42, w: 600, a: v(1.2), sobe: 1, max: 940 });
    } else if (c.tipo === "texto") {
      texto(c.topo, W / 2, 330, { tam: 36, w: 800, ls: 6, a: v(0.2), cor: AC });
      texto(c.titulo, W / 2, 760, { tam: 120, w: 900, a: v(0.5), brilho: 18, sobe: 1, lh: 140 });
      texto(c.rodape, W / 2, 1480, { tam: 42, w: 600, a: v(1.2), sobe: 1, lh: 56, max: 960 });
    } else if (c.tipo === "lados") {
      [["esq", W * 0.27, AZ, 0.3], ["dir", W * 0.73, AC, 1.4]].forEach(([k, x, cor, d]) => { const s = c[k], al = v(d);
        caixa(x - 230, 640, 460, 520, cor, al);
        texto(s.rotulo, x, 720, { tam: 40, w: 900, ls: 6, a: al, cor });
        texto(s.texto, x, 860, { tam: 36, w: 600, a: al, lh: 50, max: 420 }); });
      texto("o que cada lado diz", W / 2, 400, { tam: 40, w: 700, a: v(0.1), cor: CINZA });
    } else if (c.tipo === "pergunta") {
      texto(c.titulo, W / 2, 830, { tam: 82, w: 900, a: v(0.3, 0.5), sobe: 1, lh: 100, brilho: 10 });
      texto(c.rodape, W / 2, 1520, { tam: 50, w: 900, ls: 6, a: v(1.2, 0.5) * (0.75 + 0.25 * Math.sin(t * 6)), cor: AC, brilho: 20 });
      texto("PLENÁRIA CE", W / 2, 1620, { tam: 34, w: 800, ls: 8, a: v(1.5, 0.5) });
    }
  };

  window.render = (t) => {
    ctx.clearRect(0, 0, W, H); fundo(t); particulas(t);
    selo(1 - prog(t, S[S.length - 2] - 0.4, S[S.length - 2]));
    C.forEach((c, k) => { if (t >= S[k] - 0.1 && t <= S[k + 1] + 1) cena(c, t, S[k], k === C.length - 1 ? S[k + 1] + 1 : S[k + 1]); });
    texto(D.fontes, W / 2, 1760, { tam: 22, w: 500, a: 0.85, cor: "#8d8b82", max: 980 });
    if (t < S[S.length - 2]) marca();
  };
  window.render(0); window.pronto = true;
})();
</script>
</body>
</html>
