<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Camada de edição</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Camada transparente por cima do vídeo gravado (estilo "análise política"): legenda palavra a palavra,

(async () => {

      ctx.fillStyle = at ? AM : "#fff"; ctx.fillText(ws[i], -larg[i] / 2, 0); ctx.restore(); x += larg[i] + esp; });
    ctx.restore();
  };

    ctx.save(); ctx.globalAlpha = a; ctx.translate((1 - a) * -60, 0);
    const y0 = H * 0.68, LG = E.logo && img[E.logo];

    else { const selo = E.selo || "@PLENARIACE"; ctx.font = "700 44px Oswald"; const sw = ctx.measureText(selo).width + 32;
    ctx.fillStyle = "#fff"; ctx.fillRect(W / 2 - sw / 2, y0, sw, 60); ctx.fillStyle = AZ; ctx.textBaseline = "middle"; ctx.textAlign = "center"; ctx.fillText(selo, W / 2, y0 + 32); }
    ctx.font = "700 56px Oswald"; const pal = E.tarja.texto.toUpperCase().split(" "), lin = [""]; pal.forEach((p) => { const l = lin[lin.length - 1]; if (ctx.measureText(l + " " + p).width > 860 && l) lin.push(p); else lin[lin.length - 1] = (l + " " + p).trim(); });
    const lw = Math.max(...lin.map((l) => ctx.measureText(l).width)) + 52, lh = 62, yb = y0 + 60;
    const gt = ctx.createLinearGradient(W / 2 - lw / 2, 0, W / 2 + lw / 2, 0); gt.addColorStop(0, AZ); gt.addColorStop(1, AZ2);
    ctx.fillStyle = gt; ctx.shadowColor = "rgba(0,0,0,.4)"; ctx.shadowBlur = 24; ctx.fillRect(W / 2 - lw / 2, yb, lw, lin.length * lh + 26); ctx.shadowBlur = 0;
    ctx.fillStyle = "#fff"; lin.forEach((l, i) => ctx.fillText(l, W / 2, yb + 13 + lh / 2 + i * lh + 2)); ctx.restore(); };
  const cartao = (c, t) => {

    ctx.save();

      ctx.font = "700 34px Oswald"; const pw = ctx.measureText(c.papel.toUpperCase()).width + 50;
      ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 24; ctx.fillStyle = AZ2; ctx.fillRect(0, y, 18, 140);
      const g = ctx.createLinearGradient(18, 0, 18 + nw, 0); g.addColorStop(0, AZ); g.addColorStop(1, AZ2); ctx.fillStyle = g; ctx.fillRect(18, y, nw, 84);
      ctx.fillStyle = "#fff"; ctx.fillRect(18, y + 84, pw, 56); ctx.shadowBlur = 0;
      ctx.font = "700 60px Oswald"; ctx.fillStyle = "#fff"; ctx.fillText(c.nome.toUpperCase(), 52, y + 44);
      ctx.font = "700 34px Oswald"; ctx.fillStyle = "#222"; ctx.fillText(c.papel.toUpperCase(), 43, y + 113);
    } else if (c.tipo === "lista") { // título + itens que entram um a um
      ctx.translate(W / 2, H * (c.y || 0.36)); ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "700 50px Oswald"; const tw = ctx.measureText(c.titulo).width + 60; ctx.globalAlpha = s; ctx.scale(mola(a), mola(a));
      const g = ctx.createLinearGradient(-tw / 2, 0, tw / 2, 0); g.addColorStop(0, AZ); g.addColorStop(1, AZ2);
      ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 24; ctx.fillStyle = g; ctx.fillRect(-tw / 2, -40, tw, 80); ctx.fillStyle = "#fff"; ctx.shadowBlur = 0; ctx.fillText(c.titulo, 0, 2);
      c.itens.forEach((it, j) => { const aj = eout(prog(t, c.de + 0.35 + j * 0.3, c.de + 0.75 + j * 0.3)); if (aj <= 0) return;
        ctx.save(); ctx.globalAlpha = aj * s; ctx.translate((1 - aj) * (j % 2 ? 120 : -120), 70 + j * 84); ctx.font = "700 44px Oswald"; const iw = ctx.measureText(it).width + 50;
        ctx.shadowColor = "rgba(0,0,0,.4)"; ctx.shadowBlur = 18; ctx.fillStyle = "rgba(255,255,255,.96)"; ctx.fillRect(-iw / 2, 4, iw, 70); ctx.shadowBlur = 0;
        ctx.fillStyle = AZ; ctx.fillRect(-iw / 2, 4, 10, 70); ctx.fillStyle = "#222"; ctx.fillText(it, 5, 41); ctx.restore(); });
    } else if (c.tipo === "foto") {
      const cx = CANTOS ? (c.lado === "esq" ? W * 0.17 : W * 0.83) : c.lado === "esq" ? W * 0.27 : c.lado === "dir" ? W * 0.73 : W / 2, cy = CANTOS ? H * 0.2 : H * 0.6, r = CANTOS ? 105 : c.lado === "centro" ? 170 : 140, i = img[c.img];
      ctx.translate(cx, cy); ctx.scale(k, k); ctx.rotate((1 - Math.min(1, a * 1.5)) * (c.lado === "dir" ? 0.25 : -0.25));
      ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 40; ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, r + 10, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
      if (i) { ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.clip(); const sc = Math.max((2 * r) / i.width, (2 * r) / i.height); ctx.drawImage(i, -i.width * sc / 2, -r - Math.max(0, i.height * sc - 2 * r) * 0.1, i.width * sc, i.height * sc); ctx.restore(); }
      ctx.lineWidth = 8; ctx.strokeStyle = AZ; ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, 6.283); ctx.stroke();
      ctx.font = "700 40px Oswald"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; const nw = ctx.measureText(c.nome.toUpperCase()).width + 36;
      ctx.fillStyle = AZ; ctx.fillRect(-nw / 2, r + 22, nw, 56); ctx.fillStyle = "#fff"; ctx.fillText(c.nome.toUpperCase(), 0, r + 52);
      ctx.font = "700 28px Oswald"; const pw = ctx.measureText(c.papel.toUpperCase()).width + 24; ctx.fillStyle = "#fff"; ctx.fillRect(-pw / 2, r + 78, pw, 40); ctx.fillStyle = AZ; ctx.fillText(c.papel.toUpperCase(), 0, r + 99);
    } else {
      const txt = c.valor != null ? Math.round(c.valor * eout(prog(t, c.de, c.de + 0.9))).toLocaleString("pt-BR") : c.texto;
      if (CANTOS) { ctx.translate(c.lado === "esq" ? W * 0.18 : W * 0.82, H * 0.2); ctx.scale(k * 0.6, k * 0.6); } else { ctx.translate(W / 2, H * 0.6); ctx.scale(k, k); } ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = `400 ${c.tam || 250}px Anton`; ctx.lineWidth = 18; ctx.strokeStyle = AZ; ctx.lineJoin = "round"; ctx.strokeText(txt, 0, 0); ctx.fillStyle = "#fff"; ctx.fillText(txt, 0, 0);
      ctx.font = "700 46px Oswald"; const rw = ctx.measureText(c.rotulo).width + 40, ry = (c.tam || 250) * 0.6; ctx.fillStyle = AZ; ctx.fillRect(-rw / 2, ry, rw, 66); ctx.fillStyle = "#fff"; ctx.fillText(c.rotulo, 0, ry + 35);
    }
    ctx.restore();
  };
  const fimT = Math.max(...pal.map((w) => w.f)) + 1 + (E.extra || 0);
  window.DURACAO = fimT;
  const LOGO = () => E.logo && img[E.logo];
  const marca = (t) => { if (!E.marca || !LOGO() || t < (E.tarja ? E.tarja.ate : 0)) return; const a = eout(prog(t, E.tarja ? E.tarja.ate : 0, (E.tarja ? E.tarja.ate : 0) + 0.5)), L = LOGO(), lh = 46, lw = L.width * lh / L.height;
    ctx.save(); ctx.globalAlpha = a * 0.95; const g = ctx.createLinearGradient(40, 0, 40 + lw + 40, 0); g.addColorStop(0, AZ); g.addColorStop(1, AZ2);
    ctx.fillStyle = g; ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 16; ctx.fillRect(40, 70, lw + 40, lh + 26); ctx.shadowBlur = 0; ctx.drawImage(L, 60, 83, lw, lh); ctx.restore(); };
  const fim = (t) => { if (!E.fim || t < E.fim.de) return; const a = eout(prog(t, E.fim.de, E.fim.de + 0.6)), L = LOGO();

    ctx.globalAlpha = a; if (L) { const k = mola(prog(t, E.fim.de + 0.1, E.fim.de + 0.8)), lw = 900, lh = L.height * lw / L.width; ctx.translate(W / 2, H * 0.45); ctx.scale(k, k); ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 30; ctx.drawImage(L, -lw / 2, -lh / 2, lw, lh); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.shadowBlur = 0; }
    if (E.fim.texto) { const b = eout(prog(t, E.fim.de + 0.6, E.fim.de + 1.1)); ctx.globalAlpha = b; ctx.font = "700 50px Oswald"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff"; ctx.fillText(E.fim.texto, W / 2, H * 0.45 + 230 + (1 - b) * 30); }

    ctx.restore(); };

</script></body></html>
