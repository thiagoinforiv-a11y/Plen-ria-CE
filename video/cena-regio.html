<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Regio Ximenes · raio-X 2000–2024</title>
<style>html, body { margin: 0; background: #070707; } canvas { display: block; width: 540px; height: 960px; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="efeitos.js"></script>
<script>
/* Raio-X Regio Ximenes (vereador de Varjota), 2000-2024. Só dados do TSE (dados-regio.json). */
(async () => {
  const W = 1080, H = 1920, ctx = document.getElementById("c").getContext("2d");
  const D = await (await fetch("dados-regio.json")).json(), G = await (await fetch("geo.json")).json();
  const AC = "#4fb7ff", LR = "#ffd166", FONT = "Oswald, sans-serif", CINZA = "#c9d6e3";
  const fmt = (n) => Math.round(n).toLocaleString("pt-BR"), pc = (x, d = 1) => (x * 100).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%";
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k;
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2), eout = (x) => 1 - Math.pow(1 - x, 3);
  const prog = (t, a, b) => clamp((t - a) / (b - a)), vis = (t, a, b, f = 0.45) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
  let seed = 3; const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const S = [0, 6, 13, 20, 27, 34, 41, 48, 55, 62]; window.DURACAO = S[S.length - 1];
  // projeção
  const CE = { lon: -39.35, lat: -5.25, s: 205 }, VJ = { lon: -40.52, lat: -4.172, s: 4700 }, kx = Math.cos((4.5 * Math.PI) / 180);
  const proj = (lon, lat, v, cy = H * 0.5) => [W / 2 + (lon - v.lon) * v.s * kx, cy - (lat - v.lat) * v.s];
  const camera = (t) => { const k = ease(prog(t, 5.6, 8.4)); return { lon: lerp(CE.lon, VJ.lon, k), lat: lerp(CE.lat, VJ.lat, k), s: Math.exp(lerp(Math.log(CE.s), Math.log(VJ.s), k)) }; };
  const dentro = (x, y, p) => { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c; } return c; };
  const MAPY = H * 0.52, vj = G.varjota;
  // imagens
  const img = {}; const carregar = (k, src) => new Promise((ok) => { if (!src) return ok(); const i = new Image(); i.onload = () => { img[k] = i; ok(); }; i.onerror = ok; i.src = "../" + src; });
  await Promise.all([["rg", D.foto]].map(([k, f]) => carregar(k, f)));
  for (const [n, f, w] of [["Oswald", "oswald-latin-700-normal.woff2", "700"], ["Oswald", "oswald-latin-600-normal.woff2", "500"]]) { const ff = new FontFace(n, `url(fontes/${f})`, { weight: w }); await ff.load(); document.fonts.add(ff); }
  // formas
  const N = 2400, P = Array.from({ length: N }, () => ({ s: 0.8 + rnd() * 2.2, ph: rnd() * 6.283, d: rnd() * 0.35, a: 0.35 + rnd() * 0.65 }));
  const poeira = () => [rnd() * W, rnd() * H, "dust"], forma = {}, encher = (out) => { while (out.length < N) out.push(poeira()); return out.slice(0, N); };
  forma.poeira = Array.from({ length: N }, () => [rnd() * W, rnd() * H]);
  const amostraVJ = (v, cy, cor) => { const out = []; const lo = vj.map((p) => p[0]), la = vj.map((p) => p[1]); const [a, b, c, d] = [Math.min(...lo), Math.max(...lo), Math.min(...la), Math.max(...la)];
    while (out.length < N) { const lon = a + rnd() * (b - a), lat = c + rnd() * (d - c); if (dentro(lon, lat, vj)) out.push([...proj(lon, lat, v, cy), cor]); } return out; };
  forma.vjPequena = amostraVJ(CE, MAPY, AC);
  // 1 · linha do tempo: 7 colunas (1 ponto = 6 votos)
  const LB = 1380, LG = 14, LP = 5, LX = (i) => 110 + i * ((W - 220) / 6), topoL = (v) => LB - Math.floor(Math.round(v / 6) / LP) * LG;
  forma.linha = (() => { const out = []; D.anos.forEach(([ano, pt, v, el], i) => { const n = Math.round(v / 6); for (let k = 0; k < n; k++) for (let r = 0; r < 2; r++) out.push([LX(i) - ((LP - 1) * LG) / 2 + (k % LP) * LG + gauss(), LB - Math.floor(k / LP) * LG + gauss(), el ? AC : "#9fb3c2"]); }); return encher(out); })();
  // colunas lado a lado (1 ponto = 3 votos)
  const BASE = 1400, GAP = 20, PER = 9, CX2 = [W * 0.3, W * 0.7];
  const colunas = (a, b, ca, cb) => { const out = []; [a, b].forEach((v, j) => { const n = Math.round(v / 3); for (let k = 0; k < n; k++) for (let r = 0; r < 4; r++) out.push([CX2[j] - ((PER - 1) * GAP) / 2 + (k % PER) * GAP + gauss() * 1.5, BASE - Math.floor(k / PER) * GAP + gauss() * 1.5, j ? cb : ca]); }); return encher(out); };
  const topo = (v) => BASE - Math.floor(Math.round(v / 3) / PER) * GAP;
  forma.dez = colunas(300, D.menor2004, "#ffffff", LR); forma.cresce = colunas(437, 884, "#9fb3c2", AC);
  const RY = 860; forma.anel = Array.from({ length: N }, (_, i) => { const a = rnd() * 6.283, r = 300 + Math.abs(gauss()) * 30; return i < N * 0.8 ? [W / 2 + Math.cos(a) * r, RY + Math.sin(a) * r, rnd() < 0.7 ? AC : "#fff"] : poeira(); });
  const BA = D.bairros.map((x) => ({ ...x, xy: proj(x.lon, x.lat, VJ, MAPY) })), totV = BA.reduce((a, x) => a + x.v, 0);
  forma.mapa = (() => { const out = []; BA.forEach((x) => { const n = Math.max(20, Math.round((N * 0.85 * x.v) / totV)), r = 10 + Math.sqrt(x.v) * 4; for (let k = 0; k < n; k++) { const a = rnd() * 6.283, rr = Math.sqrt(rnd()) * r; out.push([x.xy[0] + Math.cos(a) * rr, x.xy[1] + Math.sin(a) * rr, x.b === "Centro" ? LR : AC]); } }); return encher(out); })();
  const T3 = D.bairros.slice(0, 3), BX0 = 110, BW = 700, BY = 620, BG = 250, BM = T3[0].v;
  forma.barras = (() => { const out = [], tot = T3.reduce((a, x) => a + x.v, 0); T3.forEach((x, i) => { const n = Math.round((N * 0.9 * x.v) / tot); for (let k = 0; k < n; k++) out.push([BX0 + rnd() * BW * (x.v / BM), BY + i * BG + 70 + gauss() * 9, i ? AC : LR]); }); return encher(out); })();
  forma.halo = Array.from({ length: N }, () => { const a = rnd() * 6.283, r = 270 + Math.abs(gauss()) * 40; return [W / 2 + Math.cos(a) * r, 820 + Math.sin(a) * r, rnd() < 0.65 ? AC : LR]; });
  const KF = [[0, "poeira", 0], [1.6, "vjPequena", 2.4], [S[1] + 0.2, "linha", 2.2], [S[2] + 0.2, "dez", 1.8], [S[3] + 0.2, "cresce", 1.8], [S[4] + 0.2, "anel", 1.8], [S[5] + 0.2, "mapa", 2.2], [S[6] + 0.2, "barras", 1.8], [S[7] + 0.2, "anel", 1.6], [S[8] + 0.2, "halo", 2.0]];
  const posicao = (t) => { let k = 0; while (k + 1 < KF.length && t >= KF[k + 1][0]) k++; const [t0, nome, dur] = KF[k]; return { ant: k ? forma[KF[k - 1][1]] : forma[nome], cur: forma[nome], t0, dur }; };
  const fundo = () => { const g = ctx.createRadialGradient(W / 2, H * 0.42, 50, W / 2, H * 0.5, H * 0.8); g.addColorStop(0, "#0f2a40"); g.addColorStop(1, "#03080e"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
  const texto = (s, x, y, o = {}) => { const a = o.a == null ? 1 : o.a; if (a <= 0.01) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = o.cor || "#f3f1ea"; ctx.textAlign = o.al || "center";
    let tam = o.tam || 56; ctx.font = `${o.w || 700} ${tam}px ${FONT}`; ctx.letterSpacing = (o.ls || 0) + "px"; const ls = String(s).split("\n"), lg = Math.max(...ls.map((l) => ctx.measureText(l).width));
    if (lg > (o.max || 980)) { tam *= (o.max || 980) / lg; ctx.font = `${o.w || 700} ${tam}px ${FONT}`; } if (o.brilho) { ctx.shadowColor = o.cor || "rgba(255,255,255,.6)"; ctx.shadowBlur = o.brilho; }
    const dy = o.sobe ? (1 - a) * 24 : 0; ls.forEach((l, i) => ctx.fillText(l, x, y + dy + i * (o.lh || tam * 1.18))); ctx.restore(); };
  const marca = () => { ctx.save(); ctx.font = `700 19px ${FONT}`; ctx.letterSpacing = "4px"; const s = "PLENÁRIA CE", w = ctx.measureText(s).width + 36, x = W - w - 60, y = H - 130;
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(x, y, w, 40, 20); ctx.stroke(); ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.textAlign = "left"; ctx.fillText(s, x + 18, y + 27); ctx.restore(); };
  const fonte = (a) => texto("Fonte: TSE", W / 2, H - 70, { tam: 22, w: 500, a: a * 0.8, cor: "#8fa6bb" });
  const contornos = (t, v, cy, a, realce) => { if (a <= 0.01) return; ctx.save(); ctx.lineWidth = 1.4; ctx.strokeStyle = `rgba(255,255,255,${0.16 * a})`; const k = prog(t, 0.2, 2.4);
    G.mun.forEach((r, ri) => { if (ri / G.mun.length > k * 1.02) return; ctx.beginPath(); r.forEach(([lon, lat], i) => { const [x, y] = proj(lon, lat, v, cy); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.stroke(); });
    if (realce > 0) { ctx.beginPath(); vj.forEach(([lon, lat], i) => { const [x, y] = proj(lon, lat, v, cy); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.shadowColor = AC; ctx.shadowBlur = 24 * realce; ctx.strokeStyle = `rgba(79,183,255,${0.9 * realce})`; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = `rgba(79,183,255,${0.10 * realce})`; ctx.fill(); }
    ctx.restore(); };
  const particulas = (t) => { const { ant, cur, t0, dur } = posicao(t); ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < N; i++) { const p = P[i], k = dur ? ease(clamp(((t - t0) / dur - p.d) / 0.65)) : 1, a0 = ant[i], a1 = cur[i];
      let x = lerp(a0[0], a1[0], k) + Math.sin(t * 0.9 + p.ph) * 1.6, y = lerp(a0[1], a1[1], k) + Math.cos(t * 0.8 + p.ph) * 1.6; const cv = Math.sin(k * Math.PI) * 60 * (p.d - 0.17); x += cv; y -= cv * 0.6;
      const c = (k > 0.5 ? a1[2] : a0[2]) || "#fff"; let al = p.a * (0.55 + 0.45 * Math.sin(t * 2 + p.ph * 3) ** 2); if (c === "dust") al *= 0.14; if (c === "#9fb3c2") al *= 0.5;
      ctx.globalAlpha = clamp(al); ctx.fillStyle = c === "dust" ? "#fff" : c; ctx.beginPath(); ctx.arc(x, y, p.s, 0, 6.283); ctx.fill(); }
    ctx.restore(); };
  const sel = (t, i, a = 0.3) => vis(t, S[i] + a, S[i + 1]);
  const conta = (t, i, de, ate, v) => fmt(v * eout(prog(t, S[i] + de, S[i] + ate)));
  window.render = (t) => {
    ctx.clearRect(0, 0, W, H); fundo();
    const aMapa = t < S[1] ? 1 - prog(t, S[1] - 1, S[1]) : t > S[5] && t < S[6] ? vis(t, S[5], S[6]) : 0;
    contornos(t, t < S[1] ? CE : VJ, MAPY, aMapa, (t < S[1] ? prog(t, 1.6, 3.2) : 1) * aMapa);
    particulas(t);
    texto("REGIO XIMENES", W / 2, 330, { tam: 112, w: 700, ls: 8, a: vis(t, 0.8, S[1]), brilho: 30, sobe: 1 });
    texto("VEREADOR DE VARJOTA · RAIO-X 2000–2024", W / 2, 400, { tam: 32, w: 700, ls: 5, a: vis(t, 1.4, S[1]), cor: AC });
    texto("7 ELEIÇÕES", W / 2, 330, { tam: 64, w: 700, ls: 8, a: sel(t, 1), brilho: 16 });
    texto("azul = eleito · cinza = suplente", W / 2, 392, { tam: 28, w: 500, a: sel(t, 1, 0.6), cor: "#8fa6bb" });
    D.anos.forEach(([ano, pt, v, el], i) => { const al = vis(t, S[1] + 0.8 + i * 0.15, S[2]); texto(fmt(v), LX(i), topoL(v) - 22, { tam: 34, w: 700, a: al, cor: el ? AC : "#c9d6e3" }); texto(String(ano), LX(i), LB + 52, { tam: 30, w: 700, a: al }); texto(pt, LX(i), LB + 90, { tam: 24, w: 500, a: al, cor: "#8fa6bb" }); });
    texto("5 vitórias · 2 suplências", W / 2, 1640, { tam: 50, w: 700, a: vis(t, S[1] + 2.6, S[2]), cor: AC, sobe: 1 });
    fonte(t > S[1] && t < S[8] ? 1 : 0);
    texto("2004", W / 2, 330, { tam: 70, w: 700, ls: 10, a: sel(t, 2), brilho: 14 });
    [[300, "Regio", "#fff"], [D.menor2004, "último eleito", LR]].forEach(([v, n, cor], j) => { const al = vis(t, S[2] + 0.6 + j * 0.4, S[3]); texto(conta(t, 2, 0.8, 2.2, v), CX2[j], BASE + 90, { tam: 76, w: 700, a: al, cor }); texto(n, CX2[j], BASE + 140, { tam: 30, w: 500, a: al }); });
    texto("FICOU DE FORA POR 10 VOTOS", W / 2, 1720, { tam: 52, w: 700, a: vis(t, S[2] + 2.4, S[3]), cor: LR, brilho: 12, sobe: 1 });
    texto("DESDE 2008, SÓ CRESCE", W / 2, 330, { tam: 62, w: 700, ls: 4, a: sel(t, 3), brilho: 14 });
    [[437, "2008", "#c9d6e3"], [884, "2024", AC]].forEach(([v, n, cor], j) => { const al = vis(t, S[3] + 0.6 + j * 0.4, S[4]); texto(conta(t, 3, 0.8, 2.2, v), CX2[j], BASE + 90, { tam: 76, w: 700, a: al, cor }); texto(n, CX2[j], BASE + 140, { tam: 30, w: 500, a: al }); });
    texto("+102%", W / 2, 1720, { tam: 90, w: 700, a: vis(t, S[3] + 2.4, S[4]), cor: AC, brilho: 18, sobe: 1 });
    texto("O PARTIDO", W / 2, 330, { tam: 62, w: 700, ls: 8, a: sel(t, 4) });
    [["PPS", "2000–2004"], ["PSB", "2008–2012"], ["PDT", "2016–2020"], ["PSB", "2024"]].forEach(([pt, an], i) => { const al = vis(t, S[4] + 0.6 + i * 0.5, S[5]); texto(pt, W / 2, 700 + i * 105, { tam: 70, w: 700, a: al, cor: i % 2 ? LR : AC }); texto(an, W / 2, 740 + i * 105, { tam: 26, w: 500, a: al * 0.9, cor: "#c9d6e3" }); });
    texto("Nas eleições em que Elmo Monte disputou a\nprefeitura (2008, 2016, 2020, 2024), Regio\nestava no mesmo partido", W / 2, 1300, { tam: 36, w: 500, a: vis(t, S[4] + 2.8, S[5]), lh: 46, sobe: 1 });
    texto("2024 · BAIRRO A BAIRRO", W / 2, 300, { tam: 48, w: 700, ls: 5, a: sel(t, 5), cor: "#c9d6e3" });
    { const al = vis(t, S[5] + 1.6, S[6]); const c = BA.find((x) => x.b === "Centro"); if (c) texto("CENTRO", c.xy[0], c.xy[1] - 12 - Math.sqrt(c.v) * 4 - 10, { tam: 30, w: 700, a: al, cor: LR }); const tv = BA.find((x) => x.b === "Transval"); if (tv) texto("Transval", tv.xy[0], tv.xy[1] - 40, { tam: 26, w: 600, a: al }); }
    texto("Voto concentrado na sede", W / 2, 1620, { tam: 52, w: 700, a: vis(t, S[5] + 2.6, S[6]), cor: AC, sobe: 1 });
    texto("ONDE ESTÁ O VOTO", W / 2, 400, { tam: 52, w: 700, ls: 5, a: sel(t, 6), cor: LR });
    T3.forEach((x, i) => { const al = vis(t, S[6] + 0.6 + i * 0.25, S[7]), y = BY + i * BG; texto(x.b, BX0, y, { tam: 44, w: 700, al: "left", a: al, max: 600 }); texto(fmt(x.v), W - 110, y, { tam: 44, w: 700, al: "right", a: al, cor: i ? AC : LR }); });
    texto("1 em cada 3 votos veio do Centro", W / 2, 1460, { tam: 46, w: 700, a: vis(t, S[6] + 2.2, S[7]), sobe: 1 });
    texto(`Só a escola ${D.local[0].replace("E.E.F. ", "")}: ${D.local[1]}`, W / 2, 1530, { tam: 34, w: 500, a: vis(t, S[6] + 3, S[7]), cor: "#c9d6e3", max: 960 });
    texto("TRANSVAL", W / 2, 420, { tam: 70, w: 700, ls: 10, a: sel(t, 7), brilho: 14 });
    texto("1º", W / 2, RY + 70, { tam: 220, w: 700, a: vis(t, S[7] + 0.8, S[8]), cor: AC, brilho: 26 });
    texto("o mais votado do bairro", W / 2, RY + 160, { tam: 36, w: 500, a: vis(t, S[7] + 1.2, S[8]), cor: "#c9d6e3" });
    texto(`${D.transval[0]} votos · ${String(D.transval[1]).replace(".", ",")}% do bairro`, W / 2, 1330, { tam: 46, w: 700, a: vis(t, S[7] + 2, S[8]), sobe: 1 });
    const af = vis(t, S[8] + 0.2, S[9] + 1, 0.6);
    if (af > 0.01 && img.rg) { const i = img.rg, r = 210, s = 0.85 + 0.15 * eout(af); ctx.save(); ctx.globalAlpha = af; ctx.translate(W / 2, 820); ctx.scale(s, s);
      ctx.shadowColor = AC; ctx.shadowBlur = 40; ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, 6.283); ctx.fillStyle = "#f2f2f2"; ctx.fill(); ctx.shadowBlur = 0;
      ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.clip(); const sc = Math.max((2 * r) / (i.width * 0.62), (2 * r) / (i.height * 0.62)); ctx.drawImage(i, -i.width * sc * 0.6, -i.height * sc * 0.36, i.width * sc, i.height * sc); ctx.restore();
      ctx.lineWidth = 6; ctx.strokeStyle = LR; ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, 6.283); ctx.stroke(); ctx.restore(); }
    texto("REGIO XIMENES", W / 2, 360, { tam: 96, w: 700, ls: 6, a: af, brilho: 20 });
    texto("5 mandatos · 884 votos em 2024, a maior da carreira", W / 2, 430, { tam: 32, w: 500, a: vis(t, S[8] + 0.6, S[9] + 1, 0.6), cor: "#c9d6e3" });
    texto("CANDIDATO À PRESIDÊNCIA", W / 2, 1200, { tam: 66, w: 700, ls: 4, a: vis(t, S[8] + 1.4, S[9] + 1, 0.6), cor: LR, brilho: 16, sobe: 1 });
    texto("DA CÂMARA DE VARJOTA · 2027–2028", W / 2, 1270, { tam: 42, w: 700, ls: 3, a: vis(t, S[8] + 1.8, S[9] + 1, 0.6), sobe: 1 });
    texto("Fonte dos votos: TSE · eleições municipais 2000 a 2024", W / 2, H - 70, { tam: 22, w: 500, a: af * 0.8, cor: "#8fa6bb" });
    marca();
  };
  window.render(0); window.pronto = true;
})();
</script>
</body>
</html>
