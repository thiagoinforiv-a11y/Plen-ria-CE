<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Raony Viana · 2022 × 2026 por bairro</title>
<style>html, body { margin: 0; background: #070707; } canvas { display: block; width: 540px; height: 960px; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="efeitos.js"></script>
<script>
/* Raio-X "Yury do Paredão em Varjota (2026)" no estilo de partículas do raio-X da cidade. Só dados do TSE (dados-raony.json). */
(async () => {
  const W = 1080, H = 1920, ctx = document.getElementById("c").getContext("2d");
  const D = await (await fetch("dados-raony.json")).json(), G = await (await fetch("geo.json")).json();
  const AC = "#f5b83d", LR = "#ff8a3d", FONT = "Oswald, sans-serif", CINZA = "#c9d6e3";
  const fmt = (n) => Math.round(n).toLocaleString("pt-BR"), pc = (x, d = 1) => (x * 100).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%";
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k;
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2), eout = (x) => 1 - Math.pow(1 - x, 3);
  const prog = (t, a, b) => clamp((t - a) / (b - a)), vis = (t, a, b, f = 0.45) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
  let seed = 3; const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const S = [0, 5.6, 13, 21, 30, 37, 45, 51]; window.DURACAO = S[S.length - 1];
  // projeção
  const CE = { lon: -39.35, lat: -5.25, s: 205 }, VJ = { lon: -40.52, lat: -4.172, s: 4700 }, kx = Math.cos((4.5 * Math.PI) / 180);
  const proj = (lon, lat, v, cy = H * 0.5) => [W / 2 + (lon - v.lon) * v.s * kx, cy - (lat - v.lat) * v.s];
  const camera = (t) => { const k = ease(prog(t, 5.6, 8.4)); return { lon: lerp(CE.lon, VJ.lon, k), lat: lerp(CE.lat, VJ.lat, k), s: Math.exp(lerp(Math.log(CE.s), Math.log(VJ.s), k)) }; };
  const dentro = (x, y, p) => { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c; } return c; };
  const MAPY = H * 0.52, vj = G.varjota;
  // imagens
  const img = {}; const carregar = (k, src) => new Promise((ok) => { if (!src) return ok(); const i = new Image(); i.onload = () => { img[k] = i; ok(); }; i.onerror = ok; i.src = "../" + src; });
  await Promise.all([["jm", D.jm.foto], ["bi", D.bi.foto], ["raony", D.foto1], ["raony2", D.foto2], ["cheia", D.fotoCheia]].map(([k, f]) => carregar(k, f)));
  for (const [n, f, w] of [["Oswald", "oswald-latin-700-normal.woff2", "700"], ["Oswald", "oswald-latin-600-normal.woff2", "500"]]) { const ff = new FontFace(n, `url(fontes/${f})`, { weight: w }); await ff.load(); document.fonts.add(ff); }
  // formas
  const N = 2400, P = Array.from({ length: N }, () => ({ s: 0.8 + rnd() * 2.2, ph: rnd() * 6.283, d: rnd() * 0.35, a: 0.35 + rnd() * 0.65 }));
  const poeira = () => [rnd() * W, rnd() * H, "dust"], forma = {}, RED = "#ff5a6e";
  forma.poeira = Array.from({ length: N }, () => [rnd() * W, rnd() * H]);
  const amostraVJ = (v, cy, cor) => { const out = []; const lo = vj.map((p) => p[0]), la = vj.map((p) => p[1]); const [a, b, c, d] = [Math.min(...lo), Math.max(...lo), Math.min(...la), Math.max(...la)];
    while (out.length < N) { const lon = a + rnd() * (b - a), lat = c + rnd() * (d - c); if (dentro(lon, lat, vj)) out.push([...proj(lon, lat, v, cy), cor]); } return out; };
  forma.vjPequena = amostraVJ(CE, MAPY); forma.vjCheia = amostraVJ(VJ, MAPY, "dust");
  const BASE = 1480, GAP = 14, PER = 11, CX2 = [W * 0.3, W * 0.7];
  forma.colunas = (() => { const out = []; [D.jm.votos, D.bi.votos].forEach((v, j) => { const n = Math.round(v / 10); for (let k = 0; k < n; k++) out.push([CX2[j] - ((PER - 1) * GAP) / 2 + (k % PER) * GAP, BASE - Math.floor(k / PER) * GAP, j ? AC : "#fff"]); }); while (out.length < N) out.push(poeira()); return out.slice(0, N); })();
  const BA = D.comp.filter((x) => x.lat).map((x) => ({ ...x, xy: proj(x.lon, x.lat, VJ, MAPY) })), totD = BA.reduce((a, x) => a + Math.abs(x.d), 0);
  forma.mapa = (() => { const out = []; BA.forEach((x) => { const n = Math.max(25, Math.round((N * Math.abs(x.d)) / totD)), r = 14 + Math.sqrt(Math.abs(x.d)) * 3.2; for (let k = 0; k < n; k++) { const a = rnd() * 6.283, rr = Math.sqrt(rnd()) * r; out.push([x.xy[0] + Math.cos(a) * rr, x.xy[1] + Math.sin(a) * rr, x.d < 0 ? RED : AC]); } }); while (out.length < N) out.push(poeira()); return out.slice(0, N); })();
  const T5 = D.comp.slice(0, 5), LX0 = 110, LW = 720, LY = 560, LG = 210, LM = T5[0].bi;
  forma.ganhos = (() => { const out = []; const tot = T5.reduce((a, x) => a + x.bi, 0); T5.forEach((x, i) => { const n = Math.round((N * 0.9 * x.bi) / tot); for (let k = 0; k < n; k++) { const ant = k < n * (x.j / x.bi); out.push([LX0 + rnd() * LW * ((ant ? x.j : x.bi) / LM), LY + i * LG + 62 + gauss() * 8, ant ? "#ffffff" : AC]); } }); while (out.length < N) out.push(poeira()); return out.slice(0, N); })();
  const SEG = D.comp.filter((x) => x.rb === 2), HX = SEG.map((_, i) => W * (0.2 + 0.3 * i));
  forma.segundo = Array.from({ length: N }, (_, i) => { const j = i % SEG.length, a = rnd() * 6.283, r = 60 + SEG[j].pb * 330 + Math.abs(gauss()) * 18; return [HX[j] + Math.cos(a) * r, 860 + Math.sin(a) * r, AC]; });
  const NEG = D.comp.filter((x) => x.d < 0), NX = [W * 0.3, W * 0.7];
  forma.perdas = Array.from({ length: N }, (_, i) => { const j = i % NEG.length, x = NEG[j], ant = rnd() < x.j / (x.j + x.bi), a = rnd() * 6.283, r = (ant ? 150 : 80) + Math.abs(gauss()) * 16; return [NX[j] + Math.cos(a) * r, 860 + Math.sin(a) * r, ant ? "dust" : RED]; });
  const RY = 820; forma.halo = Array.from({ length: N }, () => { const a = rnd() * 6.283, r = 220 + Math.abs(gauss()) * 40; return [W / 2 + Math.cos(a) * r, RY + Math.sin(a) * r, rnd() < 0.6 ? AC : "#fff"]; });
  const KF = [[0, "poeira", 0], [2.2, "vjPequena", 2.2], [S[1] + 0.2, "colunas", 2.0], [S[2] + 0.2, "mapa", 2.2], [S[3] + 0.2, "ganhos", 1.8], [S[4] + 0.2, "segundo", 1.8], [S[5] + 0.2, "perdas", 1.8], [S[6] + 0.2, "halo", 2.0]];
  const posicao = (t) => { let k = 0; while (k + 1 < KF.length && t >= KF[k + 1][0]) k++; const [t0, nome, dur] = KF[k]; return { ant: k ? forma[KF[k - 1][1]] : forma[nome], cur: forma[nome], t0, dur }; };
  // desenho
  const fundo = (t) => { const g = ctx.createRadialGradient(W / 2, H * 0.42, 50, W / 2, H * 0.5, H * 0.8); g.addColorStop(0, "#0f2a40"); g.addColorStop(1, "#03080e"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
  const texto = (s, x, y, o = {}) => { const a = o.a == null ? 1 : o.a; if (a <= 0.01) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = o.cor || "#f3f1ea"; ctx.textAlign = o.al || "center";
    let tam = o.tam || 56; ctx.font = `${o.w || 700} ${tam}px ${FONT}`; ctx.letterSpacing = (o.ls || 0) + "px"; const ls = String(s).split("\n"), lg = Math.max(...ls.map((l) => ctx.measureText(l).width));
    if (lg > (o.max || 980)) { tam *= (o.max || 980) / lg; ctx.font = `${o.w || 700} ${tam}px ${FONT}`; } if (o.brilho) { ctx.shadowColor = o.cor || "rgba(255,255,255,.6)"; ctx.shadowBlur = o.brilho; }
    const dy = o.sobe ? (1 - a) * 24 : 0; ls.forEach((l, i) => ctx.fillText(l, x, y + dy + i * (o.lh || tam * 1.18))); ctx.restore(); };
  const foto = (k, x, y, r, a, cor) => { if (a <= 0.01 || !img[k]) return; const s = 0.85 + 0.15 * eout(a); ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s, s);
    ctx.shadowColor = cor || "rgba(255,255,255,.35)"; ctx.shadowBlur = 40; ctx.beginPath(); ctx.arc(0, 0, r + 6, 0, 6.283); ctx.fillStyle = "#111"; ctx.fill(); ctx.shadowBlur = 0;
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.clip(); const i = img[k], sc = Math.max((2 * r) / i.width, (2 * r) / i.height); ctx.drawImage(i, -i.width * sc / 2, -i.height * sc * 0.42, i.width * sc, i.height * sc); ctx.restore();
    ctx.lineWidth = 5; ctx.strokeStyle = cor || "rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, 6.283); ctx.stroke(); ctx.restore(); };
  const marca = () => { ctx.save(); ctx.font = `700 19px ${FONT}`; ctx.letterSpacing = "4px"; const s = "PLENÁRIA CE", w = ctx.measureText(s).width + 36, x = W - w - 60, y = H - 120;
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(x, y, w, 40, 20); ctx.stroke(); ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.textAlign = "left"; ctx.fillText(s, x + 18, y + 27); ctx.restore(); };
  const contornos = (t, v, cy, a, realce) => { if (a <= 0.01) return; ctx.save(); ctx.lineWidth = 1.4; ctx.strokeStyle = `rgba(255,255,255,${0.16 * a})`; const k = prog(t, 0.2, 2.4);
    G.mun.forEach((r, ri) => { if (ri / G.mun.length > k * 1.02) return; ctx.beginPath(); r.forEach(([lon, lat], i) => { const [x, y] = proj(lon, lat, v, cy); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.stroke(); });
    if (realce > 0) { ctx.beginPath(); vj.forEach(([lon, lat], i) => { const [x, y] = proj(lon, lat, v, cy); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.shadowColor = AC; ctx.shadowBlur = 24 * realce; ctx.strokeStyle = `rgba(245,184,61,${0.9 * realce})`; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = `rgba(79,183,255,${0.10 * realce})`; ctx.fill(); }
    ctx.restore(); };
  const particulas = (t) => { const { ant, cur, t0, dur } = posicao(t); ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < N; i++) { const p = P[i], k = dur ? ease(clamp(((t - t0) / dur - p.d) / 0.65)) : 1, a0 = ant[i], a1 = cur[i];
      let x = lerp(a0[0], a1[0], k) + Math.sin(t * 0.9 + p.ph) * 1.6, y = lerp(a0[1], a1[1], k) + Math.cos(t * 0.8 + p.ph) * 1.6; const cv = Math.sin(k * Math.PI) * 60 * (p.d - 0.17); x += cv; y -= cv * 0.6;
      const c = (k > 0.5 ? a1[2] : a0[2]) || "#fff"; let al = p.a * (0.55 + 0.45 * Math.sin(t * 2 + p.ph * 3) ** 2); if (c === "dust") al *= 0.14;
      ctx.globalAlpha = clamp(al); ctx.fillStyle = c === "dust" ? "#fff" : c; ctx.beginPath(); ctx.arc(x, y, p.s, 0, 6.283); ctx.fill();
      if (dur && k > 0 && k < 1) { const k2 = ease(clamp(((t - 0.06 - t0) / dur - p.d) / 0.65)), xb = lerp(a0[0], a1[0], k2), yb = lerp(a0[1], a1[1], k2); if (Math.hypot(x - xb, y - yb) > 3) { ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = p.s * 0.9; ctx.globalAlpha = clamp(al * 0.3); ctx.beginPath(); ctx.moveTo(xb, yb); ctx.lineTo(x, y); ctx.stroke(); } } }
    ctx.restore(); };
  const raony = (x, y, r, a) => { if (a <= 0.01) return; if (img.raony2) return foto("raony2", x, y, r, a, AC); };
  const sinal = (n) => (n > 0 ? "+" : "−") + fmt(Math.abs(n)), ord = (n) => (n ? n + "º" : "–");
  window.render = (t) => {
    ctx.clearRect(0, 0, W, H); fundo(t);
    const cam = camera(t), aMapa = t < S[1] ? 1 - prog(t, S[1] - 1, S[1]) : t > S[2] && t < S[3] ? vis(t, S[2], S[3]) : 0;
    contornos(t, t < S[1] ? cam : VJ, MAPY, aMapa, (t < S[1] ? prog(t, 1.6, 3.2) : 1) * aMapa);
    particulas(t);
    texto("VARJOTA", W / 2, 330, { tam: 118, w: 700, ls: 14, a: vis(t, 0.8, S[1]), brilho: 30, sobe: 1 });
    texto("2022 × 2026 · BAIRRO A BAIRRO", W / 2, 400, { tam: 34, w: 700, ls: 6, a: vis(t, 1.4, S[1]), cor: AC });
    texto("o deputado federal apoiado por Raony Viana", W / 2, 1640, { tam: 34, w: 500, a: vis(t, 2.4, S[1]), cor: CINZA });
    texto("NA CIDADE", W / 2, 300, { tam: 40, w: 700, ls: 6, a: vis(t, S[1] + 0.3, S[2]), cor: CINZA });
    [["jm", D.jm, "#fff", "2022"], ["bi", D.bi, AC, "2026"]].forEach(([k, c, cor, ano], j) => { const al = vis(t, S[1] + 0.6 + j * 0.4, S[2]), topo = BASE - Math.floor(Math.round(c.votos / 10) / PER) * GAP;
      foto(k, CX2[j], topo - 120, 80, al, cor === "#fff" ? null : cor); texto(fmt(c.votos * eout(prog(t, S[1] + 1, S[1] + 2.6))), CX2[j], BASE + 80, { tam: 66, w: 700, a: al, cor }); texto(`${c.urna} · ${ano}`, CX2[j], BASE + 126, { tam: 28, w: 500, a: al, max: 420 }); });
    texto(`+${fmt(D.bi.votos - D.jm.votos)} votos · cresceu em ${D.cresceu} de ${D.nb} bairros`, W / 2, 1720, { tam: 44, w: 700, a: vis(t, S[1] + 2.8, S[2]), cor: AC, brilho: 14, sobe: 1, max: 980 });
    texto("ONDE AUMENTOU E ONDE DIMINUIU", W / 2, 300, { tam: 40, w: 700, ls: 4, a: vis(t, S[2] + 0.3, S[3]), cor: CINZA });
    texto("dourado = ganhou voto · vermelho = perdeu", W / 2, 352, { tam: 28, w: 500, a: vis(t, S[2] + 0.5, S[3]), cor: "#8fa6bb" });
    texto("Cresceu na sede; caiu no Croatá e em Olho d'Água", W / 2, 1650, { tam: 40, w: 700, a: vis(t, S[2] + 2.6, S[3]), sobe: 1, max: 980 });
    texto("ONDE MAIS AUMENTOU", W / 2, 360, { tam: 42, w: 700, ls: 4, a: vis(t, S[3] + 0.3, S[4]), cor: AC });
    T5.forEach((x, i) => { const al = vis(t, S[3] + 0.6 + i * 0.2, S[4]), y = LY + i * LG; texto(x.b, LX0, y, { tam: 38, w: 700, al: "left", a: al, max: 760 });
      texto(`${x.j} → ${x.bi}  (${sinal(x.d)})`, LX0 + LW * (x.bi / LM) + 18, y + 74, { tam: 34, w: 700, al: "left", a: al, cor: AC, max: 360 }); });
    texto("ONDE VIROU O 2º MAIS VOTADO", W / 2, 360, { tam: 40, w: 700, ls: 4, a: vis(t, S[4] + 0.3, S[5]), cor: CINZA });
    SEG.forEach((x, i) => { const al = vis(t, S[4] + 0.6 + i * 0.3, S[5]); texto(pc(x.pb), HX[i], 880, { tam: 54, w: 700, a: al, cor: AC }); texto(x.b, HX[i], 1080, { tam: 30, w: 600, a: al, max: 300 }); texto(`${ord(x.ra)} → ${ord(x.rb)}`, HX[i], 1124, { tam: 28, w: 500, a: al, cor: "#8fa6bb" }); });
    texto("No Acampamento, 1 em cada 5 votos", W / 2, 1600, { tam: 42, w: 700, a: vis(t, S[4] + 2.2, S[5]), sobe: 1 });
    texto("ONDE DIMINUIU", W / 2, 360, { tam: 42, w: 700, ls: 4, a: vis(t, S[5] + 0.3, S[6]), cor: RED });
    NEG.forEach((x, i) => { const al = vis(t, S[5] + 0.6 + i * 0.4, S[6]); texto(`${x.j} → ${x.bi}`, NX[i], 880, { tam: 52, w: 700, a: al, cor: RED }); texto(x.b, NX[i], 1080, { tam: 32, w: 600, a: al, max: 400 });
      texto(`mais votado: ${x.lider} (${x.liderV})`, NX[i], 1124, { tam: 26, w: 500, a: al, cor: "#8fa6bb", max: 420 }); });
    texto("Os dois pontos para trabalhar", W / 2, 1600, { tam: 42, w: 700, a: vis(t, S[5] + 2.2, S[6]), sobe: 1 });
    // fecho: foto em tela cheia, zoom lento, sombra e nome em dourado
    const af = vis(t, S[6] + 0.1, S[7] + 1, 0.7);
    if (af > 0.01 && img.cheia) { const i = img.cheia, z = 1.04 + 0.08 * prog(t, S[6], S[7] + 1), sc = Math.max(W / i.width, H / i.height) * z;
      ctx.save(); ctx.globalAlpha = af; ctx.drawImage(i, (W - i.width * sc) / 2, (H - i.height * sc) * 0.35, i.width * sc, i.height * sc);
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "rgba(3,8,14,.75)"); g.addColorStop(0.22, "rgba(3,8,14,0)"); g.addColorStop(0.62, "rgba(3,8,14,0)"); g.addColorStop(1, "rgba(3,8,14,.92)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = AC; ctx.lineWidth = 10; ctx.globalAlpha = af * 0.9; ctx.strokeRect(28, 28, W - 56, H - 56); ctx.restore(); }
    texto(`Cresceu em ${D.cresceu} de ${D.nb} bairros.`, W / 2, 200, { tam: 64, w: 700, a: vis(t, S[6] + 0.4, S[7] + 1, 0.6), sobe: 1 });
    texto("RAONY VIANA", W / 2, 1610, { tam: 120, w: 700, ls: 6, a: vis(t, S[6] + 1, S[7] + 1, 0.6), brilho: 24, cor: AC, sobe: 1 });
    texto("liderança com raiz em Varjota", W / 2, 1690, { tam: 40, w: 500, a: vis(t, S[6] + 1.4, S[7] + 1, 0.6) });
    texto("Fonte dos votos: TSE · votação por seção, 2022 e 2026", W / 2, 1800, { tam: 23, w: 500, a: vis(t, S[6] + 1.6, S[7] + 1, 0.6), cor: "#c9d6e3" });
  };
  window.render(0); window.pronto = true;
})();
</script>
